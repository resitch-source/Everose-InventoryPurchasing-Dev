<script type="text/babel">
/* adjust.jsx — Stock-adjust drawer: cycle count, write-off, transfer.
   Exports: StockAdjustDrawer */
const { useState: useStateAdj, useEffect: useEffectAdj } = React;

const WRITEOFF_REASONS = ["Damaged", "Lost / shrinkage", "Display unit", "Theft", "Expired / obsolete"];

function StockAdjustDrawer({ product, onClose, onConfirm }) {
  const [mode, setMode] = useStateAdj("count");
  const [counts, setCounts] = useStateAdj({});        // wh -> new counted qty
  const [woWh, setWoWh] = useStateAdj("");
  const [woQty, setWoQty] = useStateAdj(1);
  const [woReason, setWoReason] = useStateAdj(WRITEOFF_REASONS[0]);
  const [trFrom, setTrFrom] = useStateAdj("");
  const [trTo, setTrTo] = useStateAdj("");
  const [trQty, setTrQty] = useStateAdj(1);

  useEffectAdj(() => {
    if (product) {
      const c = {}; DATA.WAREHOUSES.forEach((w) => { c[w.id] = product.stock[w.id] || 0; });
      setCounts(c); setMode("count");
      const firstStocked = DATA.WAREHOUSES.find((w) => (product.stock[w.id] || 0) > 0) || DATA.WAREHOUSES[0];
      setWoWh(firstStocked.id); setWoQty(1); setWoReason(WRITEOFF_REASONS[0]);
      setTrFrom(firstStocked.id); setTrTo((DATA.WAREHOUSES.find((w) => w.id !== firstStocked.id) || {}).id || ""); setTrQty(1);
    }
  }, [product]);

  if (!product) return null;
  const p = product;

  // build the change set + net effect for the active mode
  let changes = [], valid = false, summary = "";
  if (mode === "count") {
    DATA.WAREHOUSES.forEach((w) => {
      const cur = p.stock[w.id] || 0; const nu = counts[w.id] === "" ? cur : (parseInt(counts[w.id]) || 0);
      if (nu !== cur) changes.push({ wh: w.id, delta: nu - cur, type: "Adjustment", reason: "Cycle count" });
    });
    valid = changes.length > 0;
    summary = changes.length + " location" + (changes.length !== 1 ? "s" : "") + " adjusted";
  } else if (mode === "writeoff") {
    const cur = p.stock[woWh] || 0; const q = Math.min(cur, Math.max(0, woQty));
    if (q > 0) { changes = [{ wh: woWh, delta: -q, type: "Adjustment", reason: woReason }]; valid = true; }
    summary = "Write off " + (changes[0] ? Math.abs(changes[0].delta) : 0) + "u";
  } else {
    const cur = p.stock[trFrom] || 0; const q = Math.min(cur, Math.max(0, trQty));
    if (q > 0 && trFrom !== trTo && trTo) {
      changes = [{ wh: trFrom, delta: -q, type: "Transfer", reason: "→ " + DATA.WAREHOUSES.find(w => w.id === trTo).short },
                 { wh: trTo, delta: q, type: "Transfer", reason: "← " + DATA.WAREHOUSES.find(w => w.id === trFrom).short }];
      valid = true;
    }
    summary = "Move " + (q || 0) + "u";
  }
  const netDelta = changes.reduce((s, c) => s + c.delta, 0);

  const stepper = (val, set, min, max) => (
    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
      <button className="btn icon sm" style={{ width: 30, height: 30 }} onClick={() => set(Math.max(min, val - 1))}>−</button>
      <input className="mono tnum" value={val} onChange={(e) => { const v = parseInt(e.target.value); set(isNaN(v) ? 0 : Math.max(min, max != null ? Math.min(max, v) : v)); }}
        style={{ width: 56, height: 30, textAlign: "center", background: "var(--bg)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 14, fontWeight: 600 }} />
      <button className="btn icon sm" style={{ width: 30, height: 30 }} onClick={() => set(max != null ? Math.min(max, val + 1) : val + 1)}>+</button>
    </div>
  );
  const whSelect = (val, set, exclude) => (
    <select value={val} onChange={(e) => set(e.target.value)}
      style={{ height: 38, background: "var(--bg)", border: "1px solid var(--line)", borderRadius: "var(--r)", padding: "0 11px", fontSize: 13, fontWeight: 600, flex: 1 }}>
      {DATA.WAREHOUSES.filter((w) => w.id !== exclude).map((w) => <option key={w.id} value={w.id}>{w.name} · {p.stock[w.id] || 0}u</option>)}
    </select>
  );

  return (
    <Drawer open={!!product} onClose={onClose} width={520}>
      <div style={{ padding: "18px 20px", borderBottom: "1px solid var(--line-soft)", flex: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <Thumb cat={p.category} size={46} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Adjust stock</div>
            <div className="mono" style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 2 }}>{p.sku} · {p.total}u on hand</div>
          </div>
          <button className="btn icon ghost" onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div style={{ marginTop: 14 }}>
          <Segmented value={mode} onChange={setMode} options={[
            { value: "count", label: "Cycle count" }, { value: "writeoff", label: "Write-off" }, { value: "transfer", label: "Transfer" },
          ]} />
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: 18 }}>
        {mode === "count" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 2 }}>Enter the physically counted quantity per location. Deltas post as adjustments.</div>
            {DATA.WAREHOUSES.map((w) => {
              const cur = p.stock[w.id] || 0; const nu = counts[w.id] === "" ? cur : (parseInt(counts[w.id]) || 0); const d = nu - cur;
              return (
                <div key={w.id} className="card" style={{ padding: "12px 14px", background: "var(--panel-2)", display: "flex", alignItems: "center", gap: 12 }}>
                  <Icon name="warehouse" size={15} style={{ color: "var(--ink-3)" }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{w.short}</div>
                    <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>system: {cur}u</div>
                  </div>
                  {d !== 0 && <span className={"badge " + (d > 0 ? "ok" : "out")} style={{ fontSize: 11 }}>{d > 0 ? "+" : ""}{d}</span>}
                  {stepper(nu, (v) => setCounts((c) => ({ ...c, [w.id]: v })), 0)}
                </div>
              );
            })}
          </div>
        )}

        {mode === "writeoff" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            <Field label="Location">{whSelect(woWh, setWoWh)}</Field>
            <Field label="Quantity to write off"><div style={{ display: "flex", alignItems: "center", gap: 12 }}>{stepper(woQty, setWoQty, 0, p.stock[woWh] || 0)}<span className="mono" style={{ fontSize: 12, color: "var(--ink-3)" }}>of {p.stock[woWh] || 0}u available</span></div></Field>
            <Field label="Reason">
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                {WRITEOFF_REASONS.map((r) => (
                  <button key={r} onClick={() => setWoReason(r)} className="badge"
                    style={{ cursor: "pointer", height: 30, padding: "0 13px", fontSize: 12, background: woReason === r ? "var(--accent-soft)" : "var(--bg-2)", color: woReason === r ? "var(--accent-text)" : "var(--ink-2)", borderColor: woReason === r ? "var(--accent-line)" : "var(--line)" }}>{r}</button>
                ))}
              </div>
            </Field>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", borderRadius: 7, background: "var(--out-soft)", border: "1px solid oklch(0.66 0.20 26 / 0.3)", fontSize: 12, color: "var(--out)" }}>
              <Icon name="alert" size={14} />Posts a loss to inventory shrinkage expense.
            </div>
          </div>
        )}

        {mode === "transfer" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            <Field label="From">{whSelect(trFrom, setTrFrom, trTo)}</Field>
            <div style={{ display: "flex", justifyContent: "center", color: "var(--ink-3)" }}><Icon name="arrowR" size={18} style={{ transform: "rotate(90deg)" }} /></div>
            <Field label="To">{whSelect(trTo, setTrTo, trFrom)}</Field>
            <Field label="Quantity to move"><div style={{ display: "flex", alignItems: "center", gap: 12 }}>{stepper(trQty, setTrQty, 0, p.stock[trFrom] || 0)}<span className="mono" style={{ fontSize: 12, color: "var(--ink-3)" }}>of {p.stock[trFrom] || 0}u at source</span></div></Field>
          </div>
        )}
      </div>

      <div style={{ padding: "14px 20px", borderTop: "1px solid var(--line-soft)", flex: "none", background: "var(--bg-2)" }}>
        <div style={{ display: "flex", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 12, color: "var(--ink-3)" }}>{valid ? summary : "No change yet"}</div>
          {mode !== "transfer" && valid && <div style={{ marginLeft: "auto", display: "flex", alignItems: "baseline", gap: 6 }}>
            <span style={{ fontSize: 11, color: "var(--ink-3)" }}>New on-hand</span>
            <span className="mono tnum" style={{ fontSize: 18, fontWeight: 700 }}>{p.total + netDelta}u</span></div>}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn primary" style={{ flex: 2 }} disabled={!valid}
            onClick={() => onConfirm(p, changes, mode)}><Icon name="check" size={15} />Post adjustment</button>
        </div>
      </div>
    </Drawer>
  );
}

function Field({ label, children }) {
  return (
    <div>
      <label style={{ fontSize: 11.5, fontWeight: 700, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: ".05em", display: "block", marginBottom: 7 }}>{label}</label>
      {children}
    </div>
  );
}

Object.assign(window, { StockAdjustDrawer });

</script>

<script type="text/babel">
/* po.jsx — Purchasing screen (AI suggested POs + PO list), Create-PO drawer,
   Suppliers screen. Exports: PurchaseScreen, CreatePODrawer, SuppliersScreen,
   suggestReorders, poValue, poStatusBadge */
const { useState: useStateP, useMemo: useMemoP, useEffect: useEffectP } = React;

function poValue(po) { return po.lines.reduce((s, l) => s + l.qty * l.cost, 0); }
function poRecvPct(po) {
  const t = po.lines.reduce((s, l) => s + l.qty, 0);
  const r = po.lines.reduce((s, l) => s + l.recv, 0);
  return t ? Math.round((r / t) * 100) : 0;
}
const PO_STAT = {
  Draft: { cls: "neutral", label: "Draft" }, Open: { cls: "accent", label: "Open" },
  Partial: { cls: "watch", label: "Partial" }, Received: { cls: "ok", label: "Received" },
};
function PoStatus({ status }) { const s = PO_STAT[status]; return <span className={"badge " + s.cls}>{s.label}</span>; }

/* ---------- AI reorder suggestion engine ---------- */
function suggestReorders() {
  const bySup = {};
  DATA.PRODUCTS.forEach((p) => {
    const st = statusFromTotal(p.total, p.reorder * 2);
    if (st === "out" || st === "low") {
      const target = Math.ceil(p.reorder * 3); // restock to ~3x reorder level
      const sug = Math.max(target - p.total - p.onOrder, p.reorder);
      if (sug <= 0) return;
      (bySup[p.supplierId] = bySup[p.supplierId] || []).push({ p, sug });
    }
  });
  return Object.entries(bySup).map(([sid, items]) => ({
    supplier: DATA.SUPPLIERS.find((s) => s.id === sid),
    items, total: items.reduce((s, it) => s + it.sug * it.p.cost, 0),
  })).sort((a, b) => b.total - a.total);
}

/* ============ CREATE PO DRAWER ============ */
function CreatePODrawer({ open, onClose, initial, onSubmit, toast }) {
  const [supplier, setSupplier] = useStateP(null);
  const [supQuery, setSupQuery] = useStateP("");
  const [lines, setLines] = useStateP([]); // {sku, name, qty, cost}
  const [prodQuery, setProdQuery] = useStateP("");

  useEffectP(() => {
    if (open && initial) {
      setSupplier(initial.supplier || null);
      setSupQuery(initial.supplier ? initial.supplier.name : "");
      setLines(initial.lines || []);
      setProdQuery("");
    } else if (!open) {
      setSupplier(null); setSupQuery(""); setLines([]); setProdQuery("");
    }
  }, [open, initial]);

  function addProduct(p) {
    setLines((ls) => {
      if (ls.find((l) => l.sku === p.sku)) return ls.map((l) => l.sku === p.sku ? { ...l, qty: l.qty + 1 } : l);
      return [...ls, { sku: p.sku, name: p.name, qty: Math.max(1, p.reorder), cost: p.cost }];
    });
    setProdQuery("");
    if (!supplier) {
      const sup = DATA.SUPPLIERS.find((s) => s.id === p.supplierId);
      setSupplier(sup); setSupQuery(sup.name);
    }
  }
  const total = lines.reduce((s, l) => s + l.qty * l.cost, 0);
  const units = lines.reduce((s, l) => s + l.qty, 0);

  return (
    <Drawer open={open} onClose={onClose} width={580}>
      <div style={{ padding: "18px 20px", borderBottom: "1px solid var(--line-soft)", flex: "none", display: "flex", alignItems: "center", gap: 12 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 700 }}>New purchase order</div>
          <div style={{ fontSize: 12, color: "var(--ink-3)" }}>Draft · auto-numbered on save</div>
        </div>
        <button className="btn icon ghost" style={{ marginLeft: "auto" }} onClick={onClose}><Icon name="x" size={16} /></button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: 16 }}>
        {/* supplier */}
        <div>
          <label style={{ fontSize: 11.5, fontWeight: 700, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: ".05em" }}>Supplier</label>
          <div style={{ marginTop: 7 }}>
            <AutoComplete value={supQuery} onChange={setSupQuery} onPick={(s) => { setSupplier(s); setSupQuery(s.name); }}
              items={DATA.SUPPLIERS} fields={[{ key: "name", w: 1 }, { key: "code", w: 0.8 }]} icon="truck"
              placeholder="Type to find a supplier… (e.g. 'hearth')"
              render={(s, q) => (
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}><HL text={s.name} q={q} /></div>
                    <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}><HL text={s.code} q={q} /> · {s.terms}</div>
                  </div>
                  <span className="badge neutral" style={{ fontSize: 10 }}>{s.lead}d lead</span>
                </div>
              )} />
          </div>
          {supplier && <div style={{ display: "flex", gap: 14, marginTop: 8, fontSize: 11.5, color: "var(--ink-3)" }}>
            <span>Terms <b style={{ color: "var(--ink-2)" }}>{supplier.terms}</b></span>
            <span>Lead <b style={{ color: "var(--ink-2)" }}>{supplier.lead}d</b></span>
            <span>On-time <b style={{ color: "var(--ink-2)" }}>{supplier.onTime}%</b></span>
          </div>}
        </div>

        {/* add product */}
        <div>
          <label style={{ fontSize: 11.5, fontWeight: 700, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: ".05em" }}>Add line items</label>
          <div style={{ marginTop: 7 }}>
            <AutoComplete value={prodQuery} onChange={setProdQuery} onPick={addProduct}
              items={DATA.PRODUCTS} fields={[{ key: "name", w: 1 }, { key: "sku", w: 0.95 }, { key: "brand", w: 0.8 }]} icon="search"
              placeholder="Scan or search product to add…"
              render={(p, q) => (
                <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                  <Thumb cat={p.category} size={32} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><HL text={p.name} q={q} /></div>
                    <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}><HL text={p.sku} q={q} /> · {money(p.cost)}</div>
                  </div>
                  <span className="mono tnum" style={{ fontSize: 12, color: "var(--ink-3)" }}>{p.total}u</span>
                </div>
              )} />
          </div>
        </div>

        {/* lines */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {lines.length === 0 && (
            <div style={{ padding: "28px 16px", textAlign: "center", color: "var(--ink-4)", border: "1px dashed var(--line)", borderRadius: "var(--r)" }}>
              <Icon name="box" size={20} style={{ marginBottom: 6 }} /><div style={{ fontSize: 12.5 }}>No items yet — search above or add from inventory.</div>
            </div>
          )}
          {lines.map((l) => (
            <div key={l.sku} className="card" style={{ padding: "10px 12px", background: "var(--panel-2)", display: "flex", alignItems: "center", gap: 11 }}>
              <Thumb cat={(DATA.pid(l.sku) || {}).category || ""} size={34} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{l.name}</div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{l.sku} · {money2(l.cost)}/u</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <button className="btn icon sm" onClick={() => setLines((ls) => ls.map((x) => x.sku === l.sku ? { ...x, qty: Math.max(1, x.qty - 1) } : x))} style={{ width: 28, height: 28 }}>−</button>
                <input className="mono tnum" value={l.qty} onChange={(e) => { const v = parseInt(e.target.value) || 0; setLines((ls) => ls.map((x) => x.sku === l.sku ? { ...x, qty: Math.max(0, v) } : x)); }}
                  style={{ width: 42, height: 28, textAlign: "center", background: "var(--bg)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13, fontWeight: 600 }} />
                <button className="btn icon sm" onClick={() => setLines((ls) => ls.map((x) => x.sku === l.sku ? { ...x, qty: x.qty + 1 } : x))} style={{ width: 28, height: 28 }}>+</button>
              </div>
              <div className="mono tnum" style={{ width: 70, textAlign: "right", fontSize: 13, fontWeight: 700 }}>{money(l.qty * l.cost)}</div>
              <button className="btn icon ghost sm" onClick={() => setLines((ls) => ls.filter((x) => x.sku !== l.sku))} style={{ width: 26 }}><Icon name="x" size={13} /></button>
            </div>
          ))}
        </div>
      </div>

      {/* footer */}
      <div style={{ padding: "14px 20px", borderTop: "1px solid var(--line-soft)", flex: "none", background: "var(--bg-2)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 12 }}>
          <div><div style={{ fontSize: 11, color: "var(--ink-3)" }}>Items</div><div className="mono tnum" style={{ fontSize: 15, fontWeight: 700 }}>{lines.length} · {units}u</div></div>
          <div style={{ marginLeft: "auto", textAlign: "right" }}><div style={{ fontSize: 11, color: "var(--ink-3)" }}>Order total</div><div className="mono tnum" style={{ fontSize: 22, fontWeight: 700 }}>{money(total)}</div></div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn primary" style={{ flex: 2 }} disabled={!supplier || lines.length === 0}
            onClick={() => { onSubmit({ supplier, lines }); }}
            ><Icon name="check" size={15} />Create purchase order</button>
        </div>
      </div>
    </Drawer>
  );
}

          render={(s, qq) => <div style={{ fontSize: 13, fontWeight: 600 }}><HL text={s.name} q={qq} /></div>} />

Object.assign(window, { PurchaseScreen, CreatePODrawer, SuppliersScreen, suggestReorders, poValue, poRecvPct, PoStatus });

<script type="text/babel">
/* receiving.jsx — Receiving screen + Receive-against-PO drawer.
   Multi-select lines, partial receipts, backorder handling.
   Exports: ReceivingScreen, ReceiveDrawer */
const { useState: useStateR, useMemo: useMemoR, useEffect: useEffectR } = React;

function ReceivingScreen({ pos, onReceive, onBatchReceive }) {
  const receivable = pos.filter((po) => po.status === "Open" || po.status === "Partial");
  const [sel, setSel] = useStateR({});
  const selIds = Object.keys(sel).filter((k) => sel[k]);
  const selPOs = receivable.filter((po) => sel[po.id]);
  const allSel = receivable.length > 0 && receivable.every((po) => sel[po.id]);
  const toggle = (id) => setSel((s) => ({ ...s, [id]: !s[id] }));
  const toggleAll = () => { const ns = {}; if (!allSel) receivable.forEach((po) => ns[po.id] = true); setSel(ns); };
  const batchUnits = selPOs.reduce((s, po) => s + po.lines.reduce((a, l) => a + (l.qty - l.recv), 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, animation: "fadeIn .2s ease both", paddingBottom: selIds.length ? 72 : 0 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <Icon name="warehouse" size={17} style={{ color: "var(--ink-2)" }} />
        <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700 }}>Awaiting receipt</h2>
        <span className="badge accent" style={{ fontSize: 11 }}>{receivable.length} POs</span>
        <span style={{ fontSize: 12, color: "var(--ink-3)" }}>tick multiple POs to batch-receive in full</span>
        {receivable.length > 0 && <button className="btn ghost sm" style={{ marginLeft: "auto" }} onClick={toggleAll}>{allSel ? "Clear selection" : "Select all"}</button>}
      </div>
      {receivable.length === 0 ? (
        <div className="card" style={{ padding: 28, textAlign: "center", color: "var(--ink-3)" }}>Nothing inbound right now.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {receivable.map((po) => {
            const sup = DATA.SUPPLIERS.find((s) => s.id === po.supplierId);
            const remaining = po.lines.reduce((s, l) => s + (l.qty - l.recv), 0);
            const overdue = po.eta < 0;
            const checked = !!sel[po.id];
            return (
              <div key={po.id} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", borderColor: checked ? "var(--accent-line)" : "var(--line-soft)", background: checked ? "var(--accent-soft)" : "var(--panel)" }}>
                <div onClick={() => toggle(po.id)} style={{ width: 22, height: 22, borderRadius: 6, flex: "none", cursor: "pointer", border: "1.5px solid " + (checked ? "var(--accent)" : "var(--line-strong)"), background: checked ? "var(--accent)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {checked && <Icon name="check" size={13} style={{ color: "oklch(0.99 0 0)" }} />}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 13, flex: "1 1 240px", minWidth: 0 }}>
                  <div style={{ width: 44, height: 44, borderRadius: 9, background: "var(--panel-2)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
                    <Icon name="truck" size={17} style={{ color: overdue ? "var(--low)" : "var(--accent-text)" }} />
                  </div>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span className="mono" style={{ fontSize: 13.5, fontWeight: 700, color: "var(--accent-text)" }}>{po.id}</span>
                      <PoStatus status={po.status} />
                    </div>
                    <div style={{ fontSize: 12.5, color: "var(--ink-2)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{sup.name}</div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 22, flex: "1 1 auto" }}>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-3)" }}>Remaining</div><div className="mono tnum" style={{ fontSize: 15, fontWeight: 700 }}>{remaining}u</div></div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-3)" }}>Lines</div><div className="mono tnum" style={{ fontSize: 15, fontWeight: 700 }}>{po.lines.length}</div></div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-3)" }}>ETA</div><div className="mono tnum" style={{ fontSize: 13.5, fontWeight: 600, color: overdue ? "var(--low)" : "var(--ink-2)" }}>{overdue ? "overdue" : po.eta === 0 ? "today" : "in " + po.eta + "d"}</div></div>
                </div>
                <button className="btn primary" onClick={() => onReceive(po)}><Icon name="check" size={15} />Receive</button>
              </div>
            );
          })}
        </div>
      )}

      {/* batch action bar */}
      {selIds.length > 0 && (
        <div style={{ position: "fixed", bottom: 18, left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 150, pointerEvents: "none" }}>
          <div className="card" style={{ pointerEvents: "auto", display: "flex", alignItems: "center", gap: 18, padding: "11px 14px 11px 18px", background: "var(--elev)", boxShadow: "var(--shadow-lg)", animation: "pop .18s ease both" }}>
            <div style={{ fontSize: 13 }}><b className="mono tnum">{selIds.length}</b> PO{selIds.length !== 1 ? "s" : ""} · <b className="mono tnum">{batchUnits}u</b> to receive</div>
            <button className="btn ghost sm" onClick={() => setSel({})}>Clear</button>
            <button className="btn primary" onClick={() => onBatchReceive(selPOs)}><Icon name="warehouse" size={15} />Batch receive in full</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ BATCH RECEIVE DRAWER ============ */
function BatchReceiveDrawer({ pos, onClose, onConfirm }) {
  const [wh, setWh] = useStateR("WH-ILIGAN");
  useEffectR(() => { if (pos && pos.length) setWh("WH-ILIGAN"); }, [pos]);
  if (!pos || pos.length === 0) return null;
  const totalUnits = pos.reduce((s, po) => s + po.lines.reduce((a, l) => a + (l.qty - l.recv), 0), 0);
  const totalCost = pos.reduce((s, po) => s + po.lines.reduce((a, l) => a + (l.qty - l.recv) * l.cost, 0), 0);

  return (
    <Drawer open={pos.length > 0} onClose={onClose} width={560}>
      <div style={{ padding: "18px 20px", borderBottom: "1px solid var(--line-soft)", flex: "none", display: "flex", alignItems: "center", gap: 12 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 700 }}>Batch receive</div>
          <div style={{ fontSize: 12, color: "var(--ink-3)" }}>{pos.length} POs · receiving all remaining units in full</div>
        </div>
        <button className="btn icon ghost" style={{ marginLeft: "auto" }} onClick={onClose}><Icon name="x" size={16} /></button>
      </div>
      <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--line-soft)", flex: "none", display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: 12, color: "var(--ink-3)" }}>Receive all into</span>
        <select value={wh} onChange={(e) => setWh(e.target.value)} style={{ flex: 1, height: 34, background: "var(--bg)", border: "1px solid var(--line)", borderRadius: "var(--r)", padding: "0 10px", fontSize: 13, fontWeight: 600 }}>
          {DATA.WAREHOUSES.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
        </select>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
        {pos.map((po) => {
          const sup = DATA.SUPPLIERS.find((s) => s.id === po.supplierId);
          const lines = po.lines.filter((l) => l.qty - l.recv > 0);
          return (
            <div key={po.id} className="card" style={{ background: "var(--panel-2)", overflow: "hidden" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "10px 13px", borderBottom: "1px solid var(--line-soft)" }}>
                <span className="mono" style={{ fontSize: 12.5, fontWeight: 700, color: "var(--accent-text)" }}>{po.id}</span>
                <span style={{ fontSize: 12, color: "var(--ink-2)" }}>{sup.name}</span>
                <span className="mono" style={{ marginLeft: "auto", fontSize: 11.5, color: "var(--ink-3)" }}>{lines.reduce((a, l) => a + (l.qty - l.recv), 0)}u</span>
              </div>
              {lines.map((l) => (
                <div key={l.sku} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 13px", fontSize: 12 }}>
                  <span style={{ flex: 1, minWidth: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: "var(--ink-2)" }}>{l.name || (DATA.pid(l.sku) || {}).name}</span>
                  <span className="mono tnum" style={{ fontWeight: 700, color: "var(--ok)" }}>+{l.qty - l.recv}</span>
                </div>
              ))}
            </div>
          );
        })}
      </div>
      <div style={{ padding: "14px 20px", borderTop: "1px solid var(--line-soft)", flex: "none", background: "var(--bg-2)" }}>
        <div style={{ display: "flex", alignItems: "center", marginBottom: 12 }}>
          <div><div style={{ fontSize: 11, color: "var(--ink-3)" }}>Total receiving</div><div className="mono tnum" style={{ fontSize: 16, fontWeight: 700 }}>{totalUnits}u · {pos.length} POs</div></div>
          <div style={{ marginLeft: "auto", textAlign: "right" }}><div style={{ fontSize: 11, color: "var(--ink-3)" }}>AP value</div><div className="mono tnum" style={{ fontSize: 18, fontWeight: 700 }}>{money(totalCost)}</div></div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn primary" style={{ flex: 2 }} onClick={() => onConfirm(pos, wh)}><Icon name="check" size={15} />Confirm batch receipt</button>
        </div>
      </div>
    </Drawer>
  );
}

/* ============ RECEIVE DRAWER ============ */
function ReceiveDrawer({ po, onClose, onConfirm, defaultWh }) {
  const [rows, setRows] = useStateR({});   // sku -> qty receiving
  const [sel, setSel] = useStateR({});     // sku -> selected
  const [wh, setWh] = useStateR(defaultWh || "WH-ILIGAN");

  useEffectR(() => {
    if (po) {
      const r = {}, s = {};
      po.lines.forEach((l) => { const rem = l.qty - l.recv; r[l.sku] = rem; s[l.sku] = rem > 0; });
      setRows(r); setSel(s); setWh(defaultWh || "WH-ILIGAN");
    }
  }, [po, defaultWh]);

  if (!po) return null;
  const sup = DATA.SUPPLIERS.find((s) => s.id === po.supplierId);
  const selLines = po.lines.filter((l) => sel[l.sku] && (rows[l.sku] || 0) > 0);
  const totalRecv = selLines.reduce((s, l) => s + (rows[l.sku] || 0), 0);
  const totalCost = selLines.reduce((s, l) => s + (rows[l.sku] || 0) * l.cost, 0);
  const willBackorder = po.lines.some((l) => { const after = l.recv + (sel[l.sku] ? (rows[l.sku] || 0) : 0); return after < l.qty; });
  const allSelected = po.lines.filter((l) => l.qty - l.recv > 0).every((l) => sel[l.sku]);

  function toggleAll() {
    const ns = {};
    po.lines.forEach((l) => { ns[l.sku] = !allSelected && (l.qty - l.recv) > 0; });
    setSel(ns);
  }

  return (
    <Drawer open={!!po} onClose={onClose} width={620}>
      <div style={{ padding: "18px 20px", borderBottom: "1px solid var(--line-soft)", flex: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
              <span style={{ fontSize: 16, fontWeight: 700 }}>Receive stock</span>
              <span className="mono badge accent">{po.id}</span>
            </div>
            <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 2 }}>{sup.name} · {sup.terms}</div>
          </div>
          <button className="btn icon ghost" style={{ marginLeft: "auto" }} onClick={onClose}><Icon name="x" size={16} /></button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
          <span style={{ fontSize: 12, color: "var(--ink-3)" }}>Receive into</span>
          <select value={wh} onChange={(e) => setWh(e.target.value)}
            style={{ flex: 1, height: 34, background: "var(--bg)", border: "1px solid var(--line)", borderRadius: "var(--r)", padding: "0 10px", fontSize: 13, fontWeight: 600 }}>
            {DATA.WAREHOUSES.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
          <button className="btn sm" onClick={toggleAll}>{allSelected ? "Clear all" : "Select all"}</button>
        </div>
      </div>

      {/* lines */}
      <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 9 }}>
        {po.lines.map((l) => {
          const p = DATA.pid(l.sku) || {};
          const rem = l.qty - l.recv;
          const done = rem <= 0;
          const selected = !!sel[l.sku];
          const val = rows[l.sku] || 0;
          const partial = selected && val < rem;
          return (
            <div key={l.sku} className="card" onClick={() => !done && setSel((s) => ({ ...s, [l.sku]: !s[l.sku] }))}
              style={{ padding: "11px 13px", background: selected ? "var(--accent-soft)" : "var(--panel-2)", border: "1px solid " + (selected ? "var(--accent-line)" : "var(--line-soft)"), opacity: done ? 0.5 : 1, cursor: done ? "default" : "pointer", display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 20, height: 20, borderRadius: 5, flex: "none", border: "1.5px solid " + (selected ? "var(--accent)" : "var(--line-strong)"), background: selected ? "var(--accent)" : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {selected && <Icon name="check" size={12} style={{ color: "oklch(0.99 0 0)" }} />}
              </div>
              <Thumb cat={p.category} size={38} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{l.name || (p.name)}</div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{l.sku} · ordered {l.qty} · received {l.recv}</div>
              </div>
              {done ? <span className="badge ok" style={{ fontSize: 10.5 }}>Complete</span> : (
                <div style={{ display: "flex", alignItems: "center", gap: 5 }} onClick={(e) => e.stopPropagation()}>
                  <button className="btn icon sm" style={{ width: 28, height: 28 }} onClick={() => setRows((r) => ({ ...r, [l.sku]: Math.max(0, (r[l.sku] || 0) - 1) }))}>−</button>
                  <input className="mono tnum" value={val} onChange={(e) => { const v = Math.min(rem, Math.max(0, parseInt(e.target.value) || 0)); setRows((r) => ({ ...r, [l.sku]: v })); setSel((s) => ({ ...s, [l.sku]: true })); }}
                    style={{ width: 44, height: 28, textAlign: "center", background: "var(--bg)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13, fontWeight: 600 }} />
                  <button className="btn icon sm" style={{ width: 28, height: 28 }} onClick={() => setRows((r) => ({ ...r, [l.sku]: Math.min(rem, (r[l.sku] || 0) + 1) }))}>+</button>
                  <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)", width: 34 }}>/ {rem}</span>
                  {partial && <span className="badge watch" style={{ fontSize: 9.5, marginLeft: 2 }}>partial</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* footer */}
      <div style={{ padding: "14px 20px", borderTop: "1px solid var(--line-soft)", flex: "none", background: "var(--bg-2)" }}>
        {willBackorder && totalRecv > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 11px", borderRadius: 7, background: "var(--watch-soft)", border: "1px solid oklch(0.80 0.14 90 / 0.3)", marginBottom: 11, fontSize: 12, color: "var(--watch)" }}>
            <Icon name="alert" size={14} />Remaining units stay on backorder — PO will be marked Partial.
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", marginBottom: 12 }}>
          <div><div style={{ fontSize: 11, color: "var(--ink-3)" }}>Receiving</div><div className="mono tnum" style={{ fontSize: 16, fontWeight: 700 }}>{totalRecv}u · {selLines.length} lines</div></div>
          <div style={{ marginLeft: "auto", textAlign: "right" }}><div style={{ fontSize: 11, color: "var(--ink-3)" }}>AP value</div><div className="mono tnum" style={{ fontSize: 18, fontWeight: 700 }}>{money(totalCost)}</div></div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn" style={{ flex: 1 }} onClick={onClose}>Cancel</button>
          <button className="btn primary" style={{ flex: 2 }} disabled={totalRecv === 0}
            onClick={() => onConfirm(po, selLines.map((l) => ({ sku: l.sku, qty: rows[l.sku] })), wh)}>
            <Icon name="check" size={15} />Confirm receipt → update stock
          </button>
        </div>
      </div>
    </Drawer>
  );
}

Object.assign(window, { ReceivingScreen, ReceiveDrawer, BatchReceiveDrawer });

</script>

<script type="text/babel">
/* pos.jsx — Point of Sale (cashier). Scan/search, cart, customer lookup,
   discounts/tax/service, split tender, change calc, receipt.
   Exports: POSScreen */
const { useState: useStatePOS, useMemo: useMemoPOS, useRef: useRefPOS } = React;

const TAX_RATE = 0.08;
const POS_WH = "WH-OZAMIS";

function POSScreen({ onComplete, toast, onPrint }) {
  const [cart, setCart] = useStatePOS([]);
  const [customer, setCustomer] = useStatePOS(DATA.CUSTOMERS[0]);
  const [custQuery, setCustQuery] = useStatePOS("");
  const [scan, setScan] = useStatePOS("");
  const [discountPct, setDiscountPct] = useStatePOS(0);
  const [payments, setPayments] = useStatePOS([]);
  const [receipt, setReceipt] = useStatePOS(null);

  const popular = useMemoPOS(() => DATA.PRODUCTS.filter((p) => p.total > 0).slice(0, 8), []);
  const subtotal = cart.reduce((s, l) => s + l.price * l.qty + (l.install ? 79 : 0), 0);
  const discount = Math.round(subtotal * (discountPct / 100));
  const taxable = subtotal - discount;
  const tax = Math.round(taxable * TAX_RATE);
  const total = taxable + tax;
  const paid = payments.reduce((s, p) => s + p.amount, 0);
  const remaining = Math.max(0, total - paid);
  const cashPaid = payments.filter((p) => p.tender === "cash").reduce((s, p) => s + p.amount, 0);
  const change = Math.max(0, paid - total);
  const units = cart.reduce((s, l) => s + l.qty, 0);

  function addProduct(p) {
    setCart((c) => {
      const ex = c.find((l) => l.sku === p.sku);
      if (ex) return c.map((l) => l.sku === p.sku ? { ...l, qty: l.qty + 1 } : l);
      return [...c, { sku: p.sku, name: p.name, price: p.price, qty: 1, serialized: p.serialized, category: p.category, install: false }];
    });
    setScan("");
  }
  function setQty(sku, q) { setCart((c) => q <= 0 ? c.filter((l) => l.sku !== sku) : c.map((l) => l.sku === sku ? { ...l, qty: q } : l)); }
  function addTender(t) {
    if (remaining <= 0 && t.id !== "cash") return;
    const amt = t.id === "cash" ? remaining : remaining; // default to full remaining
    setPayments((p) => [...p, { tender: t.id, label: t.label, amount: amt || 0 }]);
  }
  function setTenderAmt(i, v) { setPayments((p) => p.map((x, j) => j === i ? { ...x, amount: Math.max(0, v) } : x)); }
  function clearSale() { setCart([]); setPayments([]); setDiscountPct(0); setCustomer(DATA.CUSTOMERS[0]); setCustQuery(""); setReceipt(null); }

  function charge() {
    const saleId = "SO-" + Math.floor(Math.random() * 9000 + 10500);
    const data = { saleId, cart: [...cart], customer, subtotal, discount, tax, total, payments: [...payments], change, units, wh: POS_WH };
    onComplete(data);
    setReceipt(data);
  }

  const canCharge = cart.length > 0 && remaining <= 0;
  const isCredit = customer.type === "Account";

  if (receipt) return <Receipt data={receipt} onNew={clearSale} toast={toast} onPrint={onPrint} />;

  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 380px", gap: 16, animation: "fadeIn .2s ease both", alignItems: "start" }} className="pos-grid">
      {/* LEFT: scan + catalog + cart */}
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <AutoComplete value={scan} onChange={setScan} onPick={addProduct}
          items={DATA.PRODUCTS} fields={[{ key: "name", w: 1 }, { key: "sku", w: 0.95 }, { key: "brand", w: 0.8 }]} icon="search" size="lg"
          placeholder="Scan barcode or search to add to cart…"
          footer={<div style={{ display: "flex", alignItems: "center", gap: 7, color: "var(--ink-3)", fontSize: 11 }}><Icon name="sparkles" size={13} style={{ color: "var(--accent-text)" }} />Typo-tolerant · <span className="kbd">↵</span> adds top match</div>}
          render={(p, q) => (
            <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
              <Thumb cat={p.category} size={32} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><HL text={p.name} q={q} /></div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}><HL text={p.sku} q={q} /></div>
              </div>
              <span className="mono tnum" style={{ fontSize: 13, fontWeight: 700 }}>{money(p.price)}</span>
            </div>
          )} />

        {/* quick tiles */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", marginBottom: 8 }}>Quick add</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(116px, 1fr))", gap: 8 }}>
            {popular.map((p) => (
              <button key={p.sku} onClick={() => addProduct(p)} className="card"
                style={{ padding: 9, textAlign: "left", cursor: "pointer", display: "flex", flexDirection: "column", gap: 7, background: "var(--panel)" }}
                onMouseEnter={(e) => e.currentTarget.style.borderColor = "var(--accent-line)"} onMouseLeave={(e) => e.currentTarget.style.borderColor = "var(--line-soft)"}>
                <Thumb cat={p.category} size={40} />
                <div style={{ fontSize: 11, fontWeight: 600, lineHeight: 1.2, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden", minHeight: 26 }}>{p.name}</div>
                <div className="mono tnum" style={{ fontSize: 12, fontWeight: 700, color: "var(--accent-text)" }}>{money(p.price)}</div>
              </button>
            ))}
          </div>
        </div>

        {/* cart */}
        <div className="card" style={{ overflow: "hidden" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "12px 14px", borderBottom: "1px solid var(--line-soft)" }}>
            <Icon name="receipt" size={15} style={{ color: "var(--ink-2)" }} />
            <span style={{ fontWeight: 700, fontSize: 13.5 }}>Cart</span>
            <span className="mono" style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{cart.length} items · {units}u</span>
            {cart.length > 0 && <button className="btn ghost sm" style={{ marginLeft: "auto" }} onClick={() => setCart([])}>Clear</button>}
          </div>
          {cart.length === 0 ? (
            <div style={{ padding: "40px 16px", textAlign: "center", color: "var(--ink-4)" }}>
              <Icon name="box" size={24} style={{ marginBottom: 8 }} /><div style={{ fontSize: 13 }}>Scan or tap a product to start a sale</div>
            </div>
          ) : cart.map((l) => (
            <div key={l.sku} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 14px", borderBottom: "1px solid var(--line-soft)" }}>
              <Thumb cat={l.category} size={40} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{l.name}</div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{l.sku} · {money(l.price)}</div>
                {l.serialized && (
                  <button onClick={() => setCart((c) => c.map((x) => x.sku === l.sku ? { ...x, install: !x.install } : x))}
                    style={{ marginTop: 5, fontSize: 10.5, color: l.install ? "var(--accent-text)" : "var(--ink-3)", display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 13, height: 13, borderRadius: 3, border: "1px solid " + (l.install ? "var(--accent)" : "var(--line-strong)"), background: l.install ? "var(--accent)" : "transparent", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>{l.install && <Icon name="check" size={9} style={{ color: "#fff" }} />}</span>
                    + Installation (+₱79)
                  </button>
                )}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <button className="btn icon sm" style={{ width: 28, height: 28 }} onClick={() => setQty(l.sku, l.qty - 1)}>−</button>
                <span className="mono tnum" style={{ width: 28, textAlign: "center", fontSize: 14, fontWeight: 700 }}>{l.qty}</span>
                <button className="btn icon sm" style={{ width: 28, height: 28 }} onClick={() => setQty(l.sku, l.qty + 1)}>+</button>
              </div>
              <div className="mono tnum" style={{ width: 78, textAlign: "right", fontSize: 13.5, fontWeight: 700 }}>{money(l.price * l.qty + (l.install ? 79 : 0))}</div>
            </div>
          ))}
        </div>
      </div>

      {/* RIGHT: customer + totals + tender */}
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }} className="pos-rail">
        {/* customer */}
        <div className="card" style={{ padding: 14 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", marginBottom: 8 }}>Customer</div>
          <AutoComplete value={custQuery} onChange={setCustQuery} onPick={(c) => { setCustomer(c); setCustQuery(c.id === "C-1001" ? "" : c.name); }}
            items={DATA.CUSTOMERS} fields={[{ key: "name", w: 1 }, { key: "phone", w: 0.7 }, { key: "email", w: 0.6 }]} icon="search"
            placeholder="Walk-in · type to look up…"
            render={(c, q) => (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <Avatar name={c.name} size={28} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600 }}><HL text={c.name} q={q} /></div>
                  <div className="mono" style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{c.type}{c.balance ? " · owes " + money(c.balance) : ""}</div>

        {/* tender */}

                <Icon name={t.icon} size={15} style={{ color: "var(--accent-text)" }} />{t.label}
              </button>
            ))}

          {payments.length > 0 && (
            <div style={{ marginTop: 11, display: "flex", flexDirection: "column", gap: 7 }}>
              {payments.map((p, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderRadius: 7, background: "var(--panel-2)" }}>
                  <span style={{ fontSize: 12, fontWeight: 600, flex: 1 }}>{p.label}</span>
                  <span style={{ fontSize: 11, color: "var(--ink-3)" }}>₱</span>
                  <input className="mono tnum" value={p.amount} onChange={(e) => setTenderAmt(i, parseInt(e.target.value) || 0)}
                    style={{ width: 72, height: 28, textAlign: "right", background: "var(--bg)", border: "1px solid var(--line)", borderRadius: 6, fontSize: 12.5, fontWeight: 600 }} />
                  <button className="btn icon ghost sm" style={{ width: 24 }} onClick={() => setPayments((x) => x.filter((_, j) => j !== i))}><Icon name="x" size={12} /></button>
                </div>
              ))}
              {change > 0 && cashPaid > 0 && (
                <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 10px", fontSize: 12.5, color: "var(--ok)", fontWeight: 600 }}>

          <button className="btn primary" disabled={!canCharge} onClick={charge}
            style={{ width: "100%", height: 48, marginTop: 12, fontSize: 15, fontWeight: 700 }}>
            <Icon name="check" size={17} />{cart.length === 0 ? "Add items to charge" : remaining > 0 ? money(remaining) + " remaining" : "Charge " + money(total)}

}
