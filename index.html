<style>
/* ============================================================
   Retail ERP — Inventory & POS  ·  Dark high-contrast theme
   Type: IBM Plex Sans (UI) + IBM Plex Mono (codes/numbers)
   ============================================================ */

:root {
  /* accent — overridable via Tweaks (--accent set on :root) */
  --accent-h: 264;
  --accent: oklch(0.66 0.17 var(--accent-h));
  --accent-soft: oklch(0.66 0.17 var(--accent-h) / 0.14);
  --accent-line: oklch(0.66 0.17 var(--accent-h) / 0.40);
  --accent-text: oklch(0.80 0.13 var(--accent-h));

  /* cool near-black surfaces */
  --bg: oklch(0.165 0.006 264);
  --bg-2: oklch(0.195 0.007 264);
  --panel: oklch(0.205 0.008 264);
  --panel-2: oklch(0.235 0.009 264);
  --elev: oklch(0.255 0.010 264);
  --hover: oklch(0.275 0.011 264);

  /* borders */
  --line: oklch(0.30 0.010 264);
  --line-soft: oklch(0.255 0.009 264);
  --line-strong: oklch(0.40 0.012 264);

  /* text */
  --ink: oklch(0.97 0.004 264);
  --ink-2: oklch(0.76 0.010 264);
  --ink-3: oklch(0.60 0.012 264);
  --ink-4: oklch(0.48 0.012 264);

  /* status — reserved strictly for stock state */
  --ok: oklch(0.74 0.15 152);
  --ok-soft: oklch(0.74 0.15 152 / 0.15);
  --watch: oklch(0.80 0.14 90);
  --watch-soft: oklch(0.80 0.14 90 / 0.15);
  --low: oklch(0.80 0.15 66);
  --low-soft: oklch(0.80 0.15 66 / 0.15);
  --out: oklch(0.66 0.20 26);
  --out-soft: oklch(0.66 0.20 26 / 0.16);

  --r: 7px;
  --r-lg: 11px;
  --shadow: 0 1px 0 oklch(1 0 0 / 0.03) inset, 0 8px 24px -12px oklch(0 0 0 / 0.6);
  --shadow-lg: 0 24px 60px -20px oklch(0 0 0 / 0.7);

  /* density — overridable */
  --row-h: 44px;
  --pad: 16px;
  --font-ui: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  font-size: var(--font-ui);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-feature-settings: "tnum" 1; }
.tnum { font-variant-numeric: tabular-nums; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

::selection { background: var(--accent-soft); color: var(--ink); }

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font: inherit; color: inherit; }
input:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent-line); outline-offset: 1px;
}

/* ---------- density variants ---------- */
[data-density="compact"] { --row-h: 36px; --pad: 12px; --font-ui: 13px; }
[data-density="comfy"]   { --row-h: 54px; --pad: 22px; --font-ui: 15px; }

/* ---------- generic atoms ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.02em; white-space: nowrap; line-height: 1.6;
  border: 1px solid transparent;
}
.dot { width: 7px; height: 7px; border-radius: 99px; flex: none; }

.badge.ok    { color: var(--ok);    background: var(--ok-soft);    border-color: oklch(0.74 0.15 152 / 0.3); }
.badge.watch { color: var(--watch); background: var(--watch-soft); border-color: oklch(0.80 0.14 90 / 0.3); }
.badge.low   { color: var(--low);   background: var(--low-soft);   border-color: oklch(0.80 0.15 66 / 0.3); }
.badge.out   { color: var(--out);   background: var(--out-soft);   border-color: oklch(0.66 0.20 26 / 0.35); }
.badge.neutral { color: var(--ink-2); background: var(--bg-2); border-color: var(--line); }
.badge.accent  { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-line); }

.dot.ok { background: var(--ok); } .dot.watch { background: var(--watch); }
.dot.low { background: var(--low); } .dot.out { background: var(--out); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 16px; border-radius: var(--r); font-weight: 600; font-size: 13.5px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  transition: background .12s, border-color .12s, transform .04s;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); border-color: var(--line-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: transparent; color: oklch(0.99 0 0); }
.btn.primary:hover { background: oklch(0.70 0.17 var(--accent-h)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel-2); color: var(--ink); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.icon { width: 38px; padding: 0; }
.btn.icon.sm { width: 30px; }

.card {
  background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}

.kbd {
  font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3);
  background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 6px; line-height: 1.6;
}

.hr { height: 1px; background: var(--line-soft); border: 0; margin: 0; }

/* placeholder image (striped) */
.ph {
  background-color: var(--bg-2);
  background-image: repeating-linear-gradient(135deg,
    oklch(0.30 0.01 264 / 0.5) 0 1px, transparent 1px 9px);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-4); font-family: "IBM Plex Mono", monospace; font-size: 10px;
  text-align: center; border-radius: 6px; overflow: hidden;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes slideIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fade { animation: fadeIn .22s ease both; }

</style>
<style>
  /* responsive: command-center grid stacks; rail goes full width */
  @media (max-width: 1000px) {
    .cmd-grid { grid-template-columns: 1fr !important; }
    .cmd-rail { flex-direction: row !important; flex-wrap: wrap; }
    .cmd-rail > .card { flex: 1 1 220px; }
  }
  @media (max-width: 900px) {
    .pos-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 760px) {
    .cmd-rail { flex-direction: column !important; }
  }
  /* keep inline PO quick-add visible on touch */
  @media (hover: hover) {
    .cmd-add { opacity: 0; transition: opacity .12s; }
    .cmd-row:hover .cmd-add { opacity: 1; }
  }
  #root { height: 100vh; }

  /* print: show only the document */
  @media print {
    body * { visibility: hidden !important; }
    .print-doc, .print-doc * { visibility: visible !important; }
    .print-doc { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; min-height: 0 !important; box-shadow: none !important; border-radius: 0 !important; padding: 8mm 10mm !important; }
    .no-print { display: none !important; }
    .print-overlay { position: static !important; background: #fff !important; }
    @page { margin: 10mm; }
  }
</style>

<script>
/* Sample data for the Retail ERP — Inventory & Purchase Orders module.
   Plain script: assigns window.DATA. No build step. */
(function () {
  const WAREHOUSES = [
    { id: "WH-ILIGAN", name: "Main — Iligan City", short: "Iligan", type: "Distribution" },
    { id: "WH-OZAMIS", name: "Ozamis City", short: "Ozamis", type: "Store" },
    { id: "WH-DUMAGUETE", name: "Dumaguete City", short: "Dumaguete", type: "Store" },
  ];

  const SUPPLIERS = [
    { id: "SUP-001", name: "Frost & Field Appliances", code: "FROSTFLD", terms: "Net 30", lead: 7, contact: "orders@frostfield.com", rating: 4.6, onTime: 94 },
    { id: "SUP-002", name: "Hearthwood Furniture Co.", code: "HEARTHWD", terms: "Net 45", lead: 14, contact: "sales@hearthwood.co", rating: 4.2, onTime: 88 },
    { id: "SUP-003", name: "Volt Home Electronics", code: "VOLTHOME", terms: "Net 30", lead: 5, contact: "supply@volthome.com", rating: 4.8, onTime: 97 },
    { id: "SUP-004", name: "Meridian Mattress Group", code: "MERIDIAN", terms: "Net 60", lead: 21, contact: "po@meridianmg.com", rating: 3.9, onTime: 79 },
    { id: "SUP-005", name: "Cascade Kitchen Supply", code: "CASCADE", terms: "Net 30", lead: 10, contact: "wholesale@cascadeks.com", rating: 4.4, onTime: 91 },
    { id: "SUP-006", name: "Atlas Outdoor & Patio", code: "ATLASOUT", terms: "Net 30", lead: 12, contact: "trade@atlasoutdoor.com", rating: 4.1, onTime: 85 },
  ];

  // category, brand, valuation method per line
  const P = [
    // APPLIANCES — refrigeration
    ["APP-REF-4801", "Arctic Pro 27\" French-Door Refrigerator", "Refrigeration", "FrostLine", "SUP-001", 2199, 1480, 6, "FIFO", true],
    ["APP-REF-4802", "Arctic Compact 18\" Top-Freezer Fridge", "Refrigeration", "FrostLine", "SUP-001", 899, 560, 10, "FIFO", true],
    ["APP-REF-4810", "Glacier Bottom-Freezer 24\" Counter-Depth", "Refrigeration", "Volt", "SUP-003", 1649, 1090, 6, "FIFO", true],
    // APPLIANCES — laundry
    ["APP-LDY-3301", "TurboWash 5.0 cu.ft. Front-Load Washer", "Laundry", "Volt", "SUP-003", 1099, 690, 8, "FIFO", true],
    ["APP-LDY-3302", "TurboDry 7.4 cu.ft. Electric Dryer", "Laundry", "Volt", "SUP-003", 999, 620, 8, "FIFO", true],
    ["APP-LDY-3310", "AquaJet Compact Stackable Washer", "Laundry", "FrostLine", "SUP-001", 749, 470, 6, "FIFO", true],
    // APPLIANCES — kitchen
    ["APP-KIT-2201", "ChefMaster 30\" 5-Burner Gas Range", "Cooking", "Cascade", "SUP-005", 1299, 820, 5, "FIFO", true],
    ["APP-KIT-2202", "ChefMaster 24\" Built-In Dishwasher", "Cooking", "Cascade", "SUP-005", 749, 450, 8, "FIFO", true],
    ["APP-KIT-2210", "Breeze Over-Range Microwave 1.9 cu.ft.", "Cooking", "Volt", "SUP-003", 379, 210, 12, "AVG", true],
    ["APP-KIT-2215", "Cascade Pro Range Hood 36\" Stainless", "Cooking", "Cascade", "SUP-005", 549, 320, 6, "AVG", false],
    // FURNITURE — living
    ["FUR-SOF-7701", "Langley 3-Seat Fabric Sofa — Slate", "Living Room", "Hearthwood", "SUP-002", 1499, 880, 4, "AVG", false],
    ["FUR-SOF-7702", "Langley Sectional w/ Chaise — Oatmeal", "Living Room", "Hearthwood", "SUP-002", 2299, 1390, 3, "AVG", false],
    ["FUR-SOF-7710", "Camden Leather Recliner — Espresso", "Living Room", "Hearthwood", "SUP-002", 1099, 640, 5, "AVG", false],
    ["FUR-TBL-6601", "Oakridge Extending Dining Table — Walnut", "Dining", "Hearthwood", "SUP-002", 899, 520, 5, "AVG", false],
    ["FUR-CHR-6610", "Oakridge Dining Chair (Set of 2)", "Dining", "Hearthwood", "SUP-002", 329, 175, 12, "AVG", false],
    // FURNITURE — bedroom / mattresses
    ["FUR-BED-5501", "Sterling Queen Platform Bed — Charcoal", "Bedroom", "Meridian", "SUP-004", 749, 410, 5, "AVG", false],
    ["FUR-BED-5502", "Sterling King Upholstered Bed — Linen", "Bedroom", "Meridian", "SUP-004", 1049, 590, 4, "AVG", false],
    ["FUR-MAT-5520", "CloudRest Hybrid Queen Mattress", "Mattresses", "Meridian", "SUP-004", 999, 540, 8, "AVG", false],
    ["FUR-MAT-5521", "CloudRest Memory-Foam King Mattress", "Mattresses", "Meridian", "SUP-004", 1199, 660, 6, "AVG", false],
    ["FUR-DRS-5530", "Sterling 6-Drawer Dresser — Charcoal", "Bedroom", "Hearthwood", "SUP-002", 649, 360, 5, "AVG", false],
    // OUTDOOR
    ["FUR-OUT-8801", "Atlas 5-Piece Patio Dining Set", "Outdoor", "Atlas", "SUP-006", 1299, 740, 4, "AVG", false],
    ["FUR-OUT-8810", "Atlas Cushioned Patio Sofa — Graphite", "Outdoor", "Atlas", "SUP-006", 899, 510, 4, "AVG", false],
    ["APP-OUT-8820", "Atlas 4-Burner Propane Grill w/ Side", "Outdoor", "Atlas", "SUP-006", 599, 340, 6, "AVG", true],
    ["APP-SML-1101", "Breeze Countertop Air Fryer 6qt", "Small Appliances", "Volt", "SUP-003", 129, 62, 20, "AVG", false],
  ];

  // deterministic-ish pseudo random for stable stock numbers
  function seed(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
  function rng(s) { let x = s || 123456789; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 1000) / 1000; }; }

  const PRODUCTS = P.map((row, idx) => {
    const [sku, name, category, brand, supplierId, price, cost, reorder, valuation, serialized] = row;
    const r = rng(seed(sku));
    // distribute stock across warehouses; some intentionally low/out for alert states
    const stock = {};
    let total = 0;
    WAREHOUSES.forEach((w, wi) => {
      let q;
      const roll = r();
      if (idx % 7 === 0 && wi === 0) q = 0;                 // some OOS at main
      else if (idx % 5 === 0) q = Math.floor(r() * Math.max(2, reorder - 1)); // some low
      else q = Math.floor(roll * reorder * 2.4) + (wi === 0 ? reorder : 0);
      stock[w.id] = q; total += q;
    });
    const reorderTotal = reorder; // per-location threshold reference
    const onOrder = (idx % 4 === 0) ? Math.ceil(reorder * 1.5) : (idx % 6 === 0 ? reorder : 0);
    return {
      sku, name, category, brand, supplierId, price, cost, reorder, valuation, serialized,
      stock, total, onOrder, reorderTotal,
      margin: Math.round(((price - cost) / price) * 100),
      // 8-week movement sparkline (units sold)
      trend: Array.from({ length: 8 }, () => Math.floor(r() * Math.max(3, reorder))),
    };
  });

  function pid(sku) { return PRODUCTS.find(p => p.sku === sku); }

  // Stock status helper thresholds (per total vs reorder*locations approx)
  function statusOf(p) {
    if (p.total <= 0) return "out";
    if (p.total <= p.reorder) return "low";
    if (p.total <= p.reorder * 1.5) return "watch";
    return "ok";
  }

  // Recent stock movements (ledger)
  const MOVE_TYPES = ["Sale", "Sale", "Sale", "Receipt", "Transfer", "Adjustment", "Return"];
  const MOVEMENTS = [];
  let mid = 4820;
  PRODUCTS.forEach((p) => {
    const r = rng(seed(p.sku + "mv"));
    const n = 3 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) {
      const t = MOVE_TYPES[Math.floor(r() * MOVE_TYPES.length)];
      const qty = (t === "Sale" ? -1 : 1) * (1 + Math.floor(r() * 3));
      const w = WAREHOUSES[Math.floor(r() * WAREHOUSES.length)];
      MOVEMENTS.push({
        id: "MV-" + (mid++),
        sku: p.sku, type: t, qty, wh: w.id,
        ref: t === "Sale" ? "SO-" + (10000 + Math.floor(r() * 8000)) : t === "Receipt" ? "PO-" + (2400 + Math.floor(r() * 90)) : "ADJ-" + (700 + Math.floor(r() * 200)),
        days: Math.floor(r() * 21),
      });
    }
  });
  MOVEMENTS.sort((a, b) => a.days - b.days);

  // Purchase Orders
  const POS = [
    { id: "PO-2481", supplierId: "SUP-003", status: "Open", created: 2, eta: 3, lines: [
      { sku: "APP-LDY-3301", qty: 8, recv: 0, cost: 690 },
      { sku: "APP-LDY-3302", qty: 8, recv: 0, cost: 620 },
      { sku: "APP-KIT-2210", qty: 12, recv: 0, cost: 210 },
    ] },
    { id: "PO-2479", supplierId: "SUP-002", status: "Partial", created: 9, eta: 1, lines: [
      { sku: "FUR-SOF-7701", qty: 6, recv: 4, cost: 880 },
      { sku: "FUR-SOF-7702", qty: 4, recv: 2, cost: 1390 },
      { sku: "FUR-CHR-6610", qty: 16, recv: 16, cost: 175 },
    ] },
    { id: "PO-2476", supplierId: "SUP-001", status: "Open", created: 4, eta: 5, lines: [
      { sku: "APP-REF-4801", qty: 6, recv: 0, cost: 1480 },
      { sku: "APP-REF-4802", qty: 10, recv: 0, cost: 560 },
    ] },
    { id: "PO-2470", supplierId: "SUP-004", status: "Received", created: 24, eta: -3, lines: [
      { sku: "FUR-MAT-5520", qty: 10, recv: 10, cost: 540 },
      { sku: "FUR-BED-5501", qty: 6, recv: 6, cost: 410 },
    ] },
    { id: "PO-2468", supplierId: "SUP-005", status: "Partial", created: 12, eta: -1, lines: [
      { sku: "APP-KIT-2201", qty: 5, recv: 3, cost: 820 },
      { sku: "APP-KIT-2202", qty: 8, recv: 8, cost: 450 },
      { sku: "APP-KIT-2215", qty: 6, recv: 0, cost: 320 },
    ] },
    { id: "PO-2462", supplierId: "SUP-006", status: "Draft", created: 0, eta: 12, lines: [
      { sku: "FUR-OUT-8801", qty: 4, recv: 0, cost: 740 },
    ] },
  ];

  window.DATA = { WAREHOUSES, SUPPLIERS, PRODUCTS, MOVEMENTS, POS, pid, statusOf };
})();

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
/* search.jsx — typo-tolerant fuzzy search + reusable <AutoComplete>.
   Exports to window: fuzzyScore, fuzzySearch, AutoComplete, HL, Icon */
const { useState, useRef, useEffect, useMemo, useCallback } = React;

/* ---------- fuzzy matching ---------- */
// bounded Levenshtein for short tokens (typo tolerance)
function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  const dp = Array.from({ length: m + 1 }, (_, i) => i);
  for (let j = 1; j <= n; j++) {
    let prev = dp[0]; dp[0] = j;
    for (let i = 1; i <= m; i++) {
      const tmp = dp[i];
      dp[i] = Math.min(
        dp[i] + 1, dp[i - 1] + 1,
        prev + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
      prev = tmp;
    }
  }
  return dp[m];
}

// subsequence match (e.g. "afy" -> "air fryer")
function subseq(q, t) {
  let i = 0;
  for (let j = 0; j < t.length && i < q.length; j++) if (t[j] === q[i]) i++;
  return i === q.length;
}

// score a query against a target string; higher = better, 0 = no match
function fuzzyScore(query, target) {
  if (!query) return 0;
  const q = query.toLowerCase().trim();
  const t = (target || "").toLowerCase();
  if (!t) return 0;
  if (t === q) return 1000;
  if (t.startsWith(q)) return 900 - (t.length - q.length) * 0.4;
  const wordStart = t.split(/[\s\-/]+/).some(w => w.startsWith(q));
  if (wordStart) return 760;
  const idx = t.indexOf(q);
  if (idx >= 0) return 620 - idx * 1.2;
  // token-level typo tolerance
  const toks = t.split(/[\s\-/]+/);
  let best = 0;
  for (const w of toks) {
    if (!w) continue;
    const d = lev(q, w.slice(0, q.length + 2));
    const allow = q.length <= 4 ? 1 : q.length <= 7 ? 2 : 3;
    if (d <= allow) best = Math.max(best, 520 - d * 90);
  }
  if (best) return best;
  // whole-string typo tolerance for short queries
  if (q.length >= 4) {
    const d = lev(q, t.slice(0, q.length + 3));
    if (d <= (q.length <= 6 ? 2 : 3)) best = Math.max(best, 360 - d * 70);
  }
  if (best) return best;
  if (subseq(q, t)) return 240;
  return 0;
}

// search a list of items across multiple weighted fields
function fuzzySearch(query, items, fields) {
  if (!query || !query.trim()) return items.map((it) => ({ it, score: 0 }));
  const out = [];
  for (const it of items) {
    let s = 0;
    for (const f of fields) {
      const val = typeof f === "string" ? it[f] : it[f.key];
      const w = typeof f === "string" ? 1 : (f.w || 1);
      s = Math.max(s, fuzzyScore(query, val) * w);
    }
    if (s > 0) out.push({ it, score: s });
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}

/* ---------- highlight matched substring ---------- */
function HL({ text, q }) {
  if (!q) return text;
  const t = text || "";
  const i = t.toLowerCase().indexOf(q.toLowerCase().trim());
  if (i < 0) return t;
  const len = q.trim().length;
  return (
    <>{t.slice(0, i)}<mark style={{ background: "var(--accent-soft)", color: "var(--accent-text)", borderRadius: 3, padding: "0 1px" }}>{t.slice(i, i + len)}</mark>{t.slice(i + len)}</>
  );
}

/* ---------- tiny inline icon set (stroke) ---------- */
const PATHS = {
  search: "M11 11 L15 15 M7.5 12.5 a5 5 0 1 1 0-10 a5 5 0 0 1 0 10",
  box: "M2.5 5 L8 2 L13.5 5 L13.5 11 L8 14 L2.5 11 Z M2.5 5 L8 8 L13.5 5 M8 8 L8 14",
  truck: "M1.5 4 L9 4 L9 11 L1.5 11 Z M9 6.5 L12 6.5 L14 9 L14 11 L9 11 M3.5 12.5 a1.2 1.2 0 1 0 0-2.4 a1.2 1.2 0 0 0 0 2.4 M11.5 12.5 a1.2 1.2 0 1 0 0-2.4 a1.2 1.2 0 0 0 0 2.4",
  alert: "M8 1.5 L15 13.5 L1 13.5 Z M8 6 L8 9.5 M8 11.5 L8 11.6",
  chart: "M2 13 L2 2 M2 13 L14 13 M5 10 L5 13 M8 6 L8 13 M11 8 L11 13",
  plus: "M8 3 L8 13 M3 8 L13 8",
  check: "M3 8.5 L6.5 12 L13 4",
  chevR: "M6 3 L11 8 L6 13",
  chevD: "M3 6 L8 11 L13 6",
  x: "M4 4 L12 12 M12 4 L4 12",
  filter: "M2 3 L14 3 L9.5 8.5 L9.5 13 L6.5 13 L6.5 8.5 Z",
  grid: "M2 2 L7 2 L7 7 L2 7 Z M9 2 L14 2 L14 7 L9 7 Z M2 9 L7 9 L7 14 L2 14 Z M9 9 L14 9 L14 14 L9 14 Z",
  list: "M5 4 L14 4 M5 8 L14 8 M5 12 L14 12 M2 4 L2.5 4 M2 8 L2.5 8 M2 12 L2.5 12",
  cmd: "M5 2 a2.5 2.5 0 1 0 0 5 L11 7 a2.5 2.5 0 1 0 0-5 Z M11 9 a2.5 2.5 0 1 0 0 5 L5 14 a2.5 2.5 0 1 0 0-5 Z",
  sparkles: "M5 2 L6 5 L9 6 L6 7 L5 10 L4 7 L1 6 L4 5 Z M11 8 L11.7 10 L13.5 10.7 L11.7 11.4 L11 13.4 L10.3 11.4 L8.5 10.7 L10.3 10 Z",
  gauge: "M2 11 a6 6 0 0 1 12 0 M8 11 L11 7",
  arrowR: "M3 8 L13 8 M9 4 L13 8 L9 12",
  warehouse: "M2 6 L8 2.5 L14 6 L14 14 L2 14 Z M5.5 14 L5.5 9 L10.5 9 L10.5 14",
  sliders: "M3 4 L13 4 M3 8 L13 8 M3 12 L13 12 M6 4 v0 M10 8 v0 M5 12 v0",
  tag: "M8 2 L14 2 L14 8 L8 14 L2 8 Z M11 5 v.01",
  refresh: "M13 7 a5 5 0 1 0-1 4 M13 3 L13 7 L9 7",
  receipt: "M3.5 2 L12.5 2 L12.5 14 L10.5 12.5 L8 14 L5.5 12.5 L3.5 14 Z M6 5.5 L10 5.5 M6 8 L10 8",
};
function Icon({ name, size = 16, style, className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none"
      stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
      style={style} className={className} aria-hidden="true">
      <path d={PATHS[name] || ""} />
    </svg>
  );
}

/* ---------- reusable AutoComplete ----------
   props: value, onChange(text), onPick(item), items, fields,
          render(item,q), placeholder, icon, autoFocus, emptyHint, size */
function AutoComplete({
  value, onChange, onPick, items, fields, render, placeholder,
  icon = "search", autoFocus, emptyHint = "No matches", size = "md", footer,
}) {
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const wrapRef = useRef(null);
  const inputRef = useRef(null);

  const results = useMemo(
    () => fuzzySearch(value, items, fields).slice(0, 8),
    [value, items, fields]
  );

  useEffect(() => { setHi(0); }, [value]);
  useEffect(() => {
    function onDoc(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const pick = useCallback((item) => {
    onPick && onPick(item);
    setOpen(false);
  }, [onPick]);

  function onKey(e) {
    if (!open && (e.key === "ArrowDown" || e.key === "Enter")) { setOpen(true); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); setHi((h) => Math.min(h + 1, results.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); if (results[hi]) pick(results[hi].it); }
    else if (e.key === "Escape") { setOpen(false); }
  }

  const h = size === "lg" ? 50 : size === "sm" ? 34 : 42;
  const fz = size === "lg" ? 16 : 14;

  return (
    <div ref={wrapRef} style={{ position: "relative", width: "100%" }}>
      <div style={{
        display: "flex", alignItems: "center", gap: 9, height: h, padding: "0 12px",
        background: "var(--bg)", border: "1px solid var(--line)", borderRadius: "var(--r)",
        boxShadow: open ? "0 0 0 3px var(--accent-soft)" : "none",
        borderColor: open ? "var(--accent-line)" : "var(--line)", transition: "box-shadow .12s, border-color .12s",
      }}>
        <Icon name={icon} size={size === "lg" ? 18 : 16} style={{ color: open ? "var(--accent-text)" : "var(--ink-3)", flex: "none" }} />
        <input
          ref={inputRef} autoFocus={autoFocus} value={value}
          onChange={(e) => { onChange(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)} onKeyDown={onKey}
          placeholder={placeholder}
          style={{ flex: 1, minWidth: 0, background: "none", border: "none", outline: "none", fontSize: fz, color: "var(--ink)" }}
        />
        {value && (
          <button className="btn icon sm" style={{ width: 24, height: 24, background: "none", border: "none" }}
            onClick={() => { onChange(""); inputRef.current && inputRef.current.focus(); }} aria-label="Clear">
            <Icon name="x" size={13} style={{ color: "var(--ink-3)" }} />
          </button>
        )}
      </div>
      {open && (
        <div className="card fade" style={{
          position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 60,
          padding: 5, maxHeight: 360, overflowY: "auto", boxShadow: "var(--shadow-lg)",
        }}>
          {results.length === 0 && (
            <div style={{ padding: "14px 12px", color: "var(--ink-3)", fontSize: 13 }}>{emptyHint}</div>
          )}
          {results.map(({ it, score }, i) => (
            <div key={it.id || it.sku || i}
              onMouseEnter={() => setHi(i)} onMouseDown={(e) => { e.preventDefault(); pick(it); }}
              style={{
                padding: "8px 10px", borderRadius: 6, cursor: "pointer",
                background: i === hi ? "var(--accent-soft)" : "transparent",
                border: "1px solid " + (i === hi ? "var(--accent-line)" : "transparent"),
              }}>
              {render(it, value, score)}
            </div>
          ))}
          {footer && <div style={{ padding: "7px 10px 4px", borderTop: "1px solid var(--line-soft)", marginTop: 4 }}>{footer}</div>}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { fuzzyScore, fuzzySearch, AutoComplete, HL, Icon });

</script>

<script type="text/babel">
/* components.jsx — shared UI: helpers, Shell, Sidebar, Topbar, StatusBadge,
   Sparkline, StockBar, Drawer, Toasts, Avatar. Exports to window. */
const { useState: useStateC, useEffect: useEffectC, useRef: useRefC } = React;

/* ---------- format helpers ---------- */
const money = (n) => "₱" + Math.round(n).toLocaleString("en-US");
const money2 = (n) => "₱" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (n) => n.toLocaleString("en-US");
const ago = (d) => d === 0 ? "today" : d === 1 ? "1d ago" : d + "d ago";
const STAT_LABEL = { ok: "In stock", watch: "Watch", low: "Low stock", out: "Out of stock" };

function statusFromTotal(total, reorder) {
  if (total <= 0) return "out";
  if (total <= reorder) return "low";
  if (total <= reorder * 1.5) return "watch";
  return "ok";
}

/* ---------- status badge ---------- */
function StatusBadge({ status, dotOnly }) {
  if (dotOnly) return <span className={"dot " + status} title={STAT_LABEL[status]} />;
  return (
    <span className={"badge " + status}>
      <span className={"dot " + status} />{STAT_LABEL[status]}
    </span>
  );
}

/* ---------- sparkline ---------- */
function Sparkline({ data, w = 80, h = 22, color = "var(--ink-3)" }) {
  const max = Math.max(...data, 1);
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => [i * step, h - (v / max) * (h - 3) - 1.5]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = d + ` L${w} ${h} L0 ${h} Z`;
  const gid = "sg" + Math.round(data.reduce((a, b) => a + b, 0) * 7 + data.length);
  return (
    <svg width={w} height={h} style={{ display: "block" }}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stopColor={color} stopOpacity="0.22" /><stop offset="1" stopColor={color} stopOpacity="0" />
      </linearGradient></defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

/* ---------- stock health bar (per warehouse vs reorder) ---------- */
function StockBar({ value, reorder, max }) {
  const status = statusFromTotal(value, reorder);
  const cap = max || Math.max(reorder * 3, value, 1);
  const pct = Math.min(100, (value / cap) * 100);
  const rpct = Math.min(100, (reorder / cap) * 100);
  const c = { ok: "var(--ok)", watch: "var(--watch)", low: "var(--low)", out: "var(--out)" }[status];
  return (
    <div style={{ position: "relative", height: 6, background: "var(--bg)", borderRadius: 99, overflow: "hidden", border: "1px solid var(--line-soft)" }}>
      <div style={{ position: "absolute", inset: 0, width: pct + "%", background: c, borderRadius: 99, transition: "width .4s" }} />
      <div style={{ position: "absolute", top: -1, bottom: -1, left: rpct + "%", width: 1.5, background: "var(--ink-2)", opacity: 0.5 }} title="reorder level" />
    </div>
  );
}

/* ---------- product thumbnail placeholder ---------- */
function Thumb({ cat, size = 44, sku }) {
  const tag = (cat || "").split(/\s/)[0].toLowerCase();
  return (
    <div className="ph" style={{ width: size, height: size, flex: "none", fontSize: size < 40 ? 8 : 9 }}>
      <span style={{ opacity: 0.8, lineHeight: 1.1 }}>{tag}<br />shot</span>
    </div>
  );
}

/* ---------- avatar ---------- */
function Avatar({ name, size = 30 }) {
  const init = name.split(" ").map(w => w[0]).slice(0, 2).join("");
  return (
    <div style={{
      width: size, height: size, borderRadius: 99, flex: "none",
      background: "var(--accent-soft)", color: "var(--accent-text)",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: size * 0.38, fontWeight: 700, border: "1px solid var(--accent-line)",
    }}>{init}</div>
  );
}

/* ---------- Everose brand mark (geometric bloom monogram) ---------- */
function EveroseLogo({ size = 30 }) {
  const petals = [0, 60, 120, 180, 240, 300];
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" aria-label="Everose" role="img" style={{ display: "block", flex: "none" }}>
      <g>
        {petals.map((a) => (
          <ellipse key={a} cx="24" cy="13.5" rx="6.2" ry="11.5" transform={"rotate(" + a + " 24 24)"} fill="var(--accent)" opacity="0.5" />
        ))}
        {petals.map((a) => (
          <ellipse key={"i" + a} cx="24" cy="17.5" rx="3.8" ry="7.5" transform={"rotate(" + (a + 30) + " 24 24)"} fill="var(--accent-text)" opacity="0.85" />
        ))}
        <circle cx="24" cy="24" r="3.6" fill="var(--ink)" />
      </g>
    </svg>
  );
}

/* ---------- sidebar ---------- */
const NAV = [
  { id: "dashboard", label: "Dashboard", icon: "gauge" },
  { id: "pos", label: "Point of Sale", icon: "receipt" },
  { id: "inventory", label: "Inventory", icon: "box", badge: null },
  { id: "purchasing", label: "Purchase Orders", icon: "truck" },
  { id: "receiving", label: "Receiving", icon: "warehouse" },
  { id: "suppliers", label: "Suppliers", icon: "tag" },
  { id: "accounting", label: "Accounting", icon: "chart" },
  { id: "reports", label: "Reports", icon: "list" },
];
const NAV_DISABLED = [
];

function Sidebar({ route, setRoute, collapsed, alertCount, mobileOpen, setMobileOpen }) {
  const item = (n, disabled) => {
    const active = route === n.id;
    return (
      <button key={n.id} disabled={disabled}
        onClick={() => { if (!disabled) { setRoute(n.id); setMobileOpen && setMobileOpen(false); } }}
        title={n.label}
        style={{
          display: "flex", alignItems: "center", gap: 11, width: "100%",
          height: 40, padding: collapsed ? 0 : "0 12px", justifyContent: collapsed ? "center" : "flex-start",
          borderRadius: var_r(), color: active ? "var(--ink)" : disabled ? "var(--ink-4)" : "var(--ink-2)",
          background: active ? "var(--accent-soft)" : "transparent",
          border: "1px solid " + (active ? "var(--accent-line)" : "transparent"),
          cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.55 : 1, position: "relative",
          fontWeight: active ? 600 : 500, fontSize: 13.5,
        }}
        onMouseEnter={(e) => { if (!active && !disabled) e.currentTarget.style.background = "var(--panel-2)"; }}
        onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = active ? "var(--accent-soft)" : "transparent"; }}>
        {active && <span style={{ position: "absolute", left: -1, top: 9, bottom: 9, width: 2.5, borderRadius: 99, background: "var(--accent)" }} />}
        <Icon name={n.icon} size={17} style={{ flex: "none", color: active ? "var(--accent-text)" : "inherit" }} />
        {!collapsed && <span style={{ flex: 1, textAlign: "left" }}>{n.label}</span>}
        {!collapsed && disabled && <span style={{ fontSize: 9.5, color: "var(--ink-4)", letterSpacing: ".04em" }}>SOON</span>}
        {!collapsed && n.id === "inventory" && alertCount > 0 && (
          <span className="badge low" style={{ padding: "0 7px", fontSize: 10.5 }}>{alertCount}</span>
        )}
      </button>
    );
  };

  return (
    <aside style={{
      width: collapsed ? 60 : 224, flex: "none", background: "var(--bg-2)",
      borderRight: "1px solid var(--line-soft)", display: "flex", flexDirection: "column",
      transition: "width .18s", height: "100%",
    }}>
      <div style={{ height: 60, display: "flex", alignItems: "center", gap: 11, padding: collapsed ? 0 : "0 14px", justifyContent: collapsed ? "center" : "flex-start", borderBottom: "1px solid var(--line-soft)", flex: "none" }}>
        {collapsed ? (
          <EveroseLogo size={32} />
        ) : (
          <React.Fragment>
            <EveroseLogo size={34} />
            <div style={{ lineHeight: 1.15, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 13.5, letterSpacing: "-0.01em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Everose</div>
              <div className="mono" style={{ fontSize: 9, color: "var(--ink-3)", letterSpacing: ".08em", whiteSpace: "nowrap" }}>MARKETING CORP.</div>
            </div>
          </React.Fragment>
        )}
      </div>
      <nav style={{ flex: 1, overflowY: "auto", padding: 8, display: "flex", flexDirection: "column", gap: 2 }}>
        {!collapsed && <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: ".08em", color: "var(--ink-4)", padding: "10px 12px 5px" }}>OPERATIONS</div>}
        {NAV.map((n) => item(n, false))}
        {!collapsed && NAV_DISABLED.length > 0 && <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: ".08em", color: "var(--ink-4)", padding: "14px 12px 5px" }}>OTHER MODULES</div>}
        {collapsed && NAV_DISABLED.length > 0 && <div className="hr" style={{ margin: "8px 6px" }} />}
        {NAV_DISABLED.map((n) => item(n, true))}

          <Avatar name="Dana Reyes" size={collapsed ? 30 : 32} />
          {!collapsed && <div style={{ lineHeight: 1.2, minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Dana Reyes</div>
            <div style={{ fontSize: 11, color: "var(--ink-3)" }}>Warehouse Mgr</div>

/* ---------- drawer (right side) ---------- */
function Drawer({ open, onClose, children, width = 520 }) {
  useEffectC(() => {
    function esc(e) { if (e.key === "Escape") onClose(); }
    if (open) document.addEventListener("keydown", esc);
    return () => document.removeEventListener("keydown", esc);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200 }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "oklch(0 0 0 / 0.55)", animation: "fadeIn .15s ease" }} />
      <div className="card" style={{
        position: "absolute", top: 0, right: 0, bottom: 0, width: "min(" + width + "px, 94vw)",
        borderRadius: 0, borderRight: "none", borderTop: "none", borderBottom: "none",
        display: "flex", flexDirection: "column", animation: "slideIn .22s cubic-bezier(.2,.7,.3,1) both",
        boxShadow: "var(--shadow-lg)", background: "var(--panel)",
      }}>{children}</div>
    </div>
  );
}

/* ---------- toasts ---------- */
let _toastId = 0;
function useToasts() {
  const [toasts, setToasts] = useStateC([]);
  const push = (msg, kind = "ok") => {
    const id = ++_toastId;
    setToasts((t) => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
  };
  return [toasts, push];
}
function Toasts({ toasts }) {
  return (
    <div style={{ position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", zIndex: 400, display: "flex", flexDirection: "column", gap: 8, alignItems: "center", pointerEvents: "none" }}>
      {toasts.map((t) => (
        <div key={t.id} className="card" style={{
          display: "flex", alignItems: "center", gap: 10, padding: "11px 16px", animation: "pop .2s ease both",
          background: "var(--elev)", boxShadow: "var(--shadow-lg)", fontSize: 13.5, fontWeight: 500,
        }}>
          <span className={"dot " + (t.kind === "ok" ? "ok" : t.kind)} style={{ width: 8, height: 8 }} />
          {t.msg}
        </div>
      ))}
    </div>
  );
}

/* ---------- segmented control ---------- */
function Segmented({ value, options, onChange, size }) {
  return (
    <div style={{ display: "inline-flex", background: "var(--bg)", border: "1px solid var(--line)", borderRadius: "var(--r)", padding: 3, gap: 2 }}>
      {options.map((o) => {
        const isObj = o && typeof o === "object";
        const v = isObj ? o.value : o, label = isObj ? o.label : o, ic = isObj ? o.icon : null;
        const active = value === v;
        return (
          <button key={v} onClick={() => onChange(v)} title={label}
            style={{
              display: "flex", alignItems: "center", gap: 6, height: size === "sm" ? 26 : 30, padding: "0 11px",
              borderRadius: 5, fontSize: 12.5, fontWeight: 600,
              background: active ? "var(--panel-2)" : "transparent",
              color: active ? "var(--ink)" : "var(--ink-3)",
              boxShadow: active ? "var(--shadow)" : "none",
            }}>
            {ic && <Icon name={ic} size={14} />}{label && <span>{label}</span>}
          </button>
        );
      })}
    </div>
  );
}

Object.assign(window, {
  money, money2, num, ago, STAT_LABEL, statusFromTotal, StatusBadge, Sparkline,
  StockBar, Thumb, Avatar, Sidebar, Drawer, useToasts, Toasts, Segmented,
});

</script>

<script type="text/babel">
/* inventory.jsx — hero screen: toolbar + filters + 3 layout directions.
   Direction A = Dense Ledger · B = Stock Board · C = Command/Health.
   Exports to window: InventoryScreen */
const { useState: useStateI, useMemo: useMemoI } = React;

const CATEGORIES = ["All", "Refrigeration", "Laundry", "Cooking", "Living Room", "Dining", "Bedroom", "Mattresses", "Outdoor", "Small Appliances"];
const STATUS_FILTERS = [
  { value: "all", label: "All" },
  { value: "alert", label: "Needs attention" },
  { value: "out", label: "Out" },
  { value: "low", label: "Low" },
  { value: "ok", label: "Healthy" },
];

function useInventory(query, cat, statusF, wh, rev) {
  return useMemoI(() => {
    let items = DATA.PRODUCTS.map((p) => {
      const total = wh === "all" ? p.total : (p.stock[wh] || 0);
      const reorder = wh === "all" ? p.reorder * DATA.WAREHOUSES.length * 0.5 : p.reorder;
      const status = statusFromTotal(total, reorder);
      return { ...p, _total: total, _reorder: reorder, _status: status };
    });
    if (cat !== "All") items = items.filter((p) => p.category === cat);
    if (statusF === "alert") items = items.filter((p) => p._status === "out" || p._status === "low");
    else if (statusF !== "all") items = items.filter((p) => p._status === statusF);
    if (query && query.trim()) {
      const scored = fuzzySearch(query, items, [{ key: "name", w: 1 }, { key: "sku", w: 0.95 }, { key: "brand", w: 0.8 }, { key: "category", w: 0.6 }]);
      items = scored.map((s) => s.it);
    } else {
      const rank = { out: 0, low: 1, watch: 2, ok: 3 };
      items.sort((a, b) => rank[a._status] - rank[b._status] || b._total - a._total);
    }
    return items;
  }, [query, cat, statusF, wh, rev]);
}

/* ============ TOOLBAR ============ */
function Toolbar({ query, setQuery, cat, setCat, statusF, setStatusF, wh, setWh, layout, setLayout, count, onNewPO }) {
  const whOpts = [{ value: "all", label: "All locations" }, ...DATA.WAREHOUSES.map((w) => ({ value: w.id, label: w.short }))];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 320px", minWidth: 240, maxWidth: 460, position: "relative" }}>
          <ProductSearch query={query} setQuery={setQuery} />
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginLeft: "auto", flexWrap: "wrap" }}>
          <Segmented value={wh} options={whOpts} onChange={setWh} />
          <Segmented value={layout} onChange={setLayout} size="sm" options={[
            { value: "ledger", icon: "list" }, { value: "board", icon: "grid" }, { value: "command", icon: "cmd" },
          ]} />
          <button className="btn primary" onClick={onNewPO}><Icon name="plus" size={15} />New PO</button>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
          {STATUS_FILTERS.map((s) => {
            const active = statusF === s.value;
            return (
              <button key={s.value} onClick={() => setStatusF(s.value)} className="badge"
                style={{
                  cursor: "pointer", height: 28, padding: "0 12px", fontSize: 12,
                  background: active ? "var(--accent-soft)" : "var(--bg-2)",
                  color: active ? "var(--accent-text)" : "var(--ink-2)",
                  borderColor: active ? "var(--accent-line)" : "var(--line)",
                }}>{s.label}</button>
            );
          })}
        </div>
        <div style={{ width: 1, height: 22, background: "var(--line)", margin: "0 4px" }} />
        <select value={cat} onChange={(e) => setCat(e.target.value)}
          style={{ height: 28, background: "var(--bg-2)", border: "1px solid var(--line)", borderRadius: 99, padding: "0 12px", fontSize: 12, color: "var(--ink-2)", fontWeight: 600 }}>
          {CATEGORIES.map((c) => <option key={c} value={c}>{c === "All" ? "All categories" : c}</option>)}
        </select>
        <div style={{ marginLeft: "auto", fontSize: 12, color: "var(--ink-3)" }} className="mono tnum">{count} SKUs</div>
      </div>
    </div>
  );
}

/* product search with rich dropdown rows (typo-tolerant) */
function ProductSearch({ query, setQuery }) {
  return (
    <AutoComplete
      value={query} onChange={setQuery} onPick={(it) => setQuery(it.name)}
      items={DATA.PRODUCTS} fields={[{ key: "name", w: 1 }, { key: "sku", w: 0.95 }, { key: "brand", w: 0.8 }]}
      placeholder="Search products, SKU, brand…  (try a typo)" icon="search" size="lg"
      footer={<div style={{ display: "flex", alignItems: "center", gap: 7, color: "var(--ink-3)", fontSize: 11 }}>
        <Icon name="sparkles" size={13} style={{ color: "var(--accent-text)" }} /> Fuzzy match · tolerates typos · <span className="kbd">↑↓</span> <span className="kbd">↵</span></div>}
      render={(it, q) => {
        const st = statusFromTotal(it.total, it.reorder * 2);
        return (
          <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
            <Thumb cat={it.category} size={34} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><HL text={it.name} q={q} /></div>
              <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}><HL text={it.sku} q={q} /> · {it.brand}</div>
            </div>
            <div style={{ textAlign: "right", flex: "none" }}>
              <div className="mono tnum" style={{ fontSize: 13, fontWeight: 600 }}>{it.total}</div>
              <StatusBadge status={st} dotOnly />
            </div>
          </div>
        );
      }}
    />
  );
}

/* ============ DIRECTION A — DENSE LEDGER ============ */
function LedgerView({ items, query, wh, onOpen }) {
  const cols = wh === "all";
  return (
    <div className="card" style={{ overflow: "hidden", marginTop: 16 }}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 880 }}>
          <thead>
            <tr style={{ background: "var(--bg-2)", borderBottom: "1px solid var(--line)" }}>
              {["Product", "SKU", "Status", ...(cols ? DATA.WAREHOUSES.map(w => w.short) : ["On hand"]), "On order", "8-wk sales", "Cost", "Value", ""].map((h, i) => (
                <th key={i} style={{ textAlign: i === 0 ? "left" : i >= 3 ? "right" : "left", padding: "10px 14px", fontSize: 10.5, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-3)", textTransform: "uppercase", whiteSpace: "nowrap", position: i === 0 ? "sticky" : "static", left: 0, background: "var(--bg-2)", zIndex: i === 0 ? 2 : 1 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {items.map((p) => (
              <tr key={p.sku} onClick={() => onOpen(p)}
                style={{ borderBottom: "1px solid var(--line-soft)", cursor: "pointer", height: "var(--row-h)" }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"}
                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                <td style={{ padding: "8px 14px", position: "sticky", left: 0, background: "inherit", zIndex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                    <Thumb cat={p.category} size={34} />
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, maxWidth: 280, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><HL text={p.name} q={query} /></div>
                      <div style={{ fontSize: 11, color: "var(--ink-3)" }}>{p.brand} · {p.category}</div>
                    </div>
                  </div>
                </td>
                <td className="mono" style={{ padding: "8px 14px", fontSize: 12, color: "var(--ink-2)", whiteSpace: "nowrap" }}><HL text={p.sku} q={query} /></td>
                <td style={{ padding: "8px 14px" }}><StatusBadge status={p._status} /></td>
                {cols ? DATA.WAREHOUSES.map((w) => {
                  const v = p.stock[w.id] || 0;
                  return <td key={w.id} className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 13, color: v === 0 ? "var(--out)" : v <= p.reorder ? "var(--low)" : "var(--ink)" }}>{v}</td>;
                }) : <td className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 13, fontWeight: 600 }}>{p._total}</td>}
                <td className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 13, color: p.onOrder ? "var(--accent-text)" : "var(--ink-4)" }}>{p.onOrder ? "+" + p.onOrder : "—"}</td>
                <td style={{ padding: "8px 14px", textAlign: "right" }}><div style={{ display: "inline-block" }}><Sparkline data={p.trend} color={"var(--ink-3)"} /></div></td>
                <td className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 12.5, color: "var(--ink-2)" }}>{money(p.cost)}</td>
                <td className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 12.5, fontWeight: 600 }}>{money(p.cost * p._total)}</td>
                <td style={{ padding: "8px 10px 8px 4px", textAlign: "right" }}><Icon name="chevR" size={14} style={{ color: "var(--ink-4)" }} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {items.length === 0 && <Empty />}
    </div>
  );
}

/* ============ DIRECTION B — STOCK BOARD ============ */
function BoardView({ items, query, wh, onOpen }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(264px, 1fr))", gap: 14, marginTop: 16 }}>
      {items.map((p) => (
        <div key={p.sku} className="card" onClick={() => onOpen(p)}
          style={{ padding: 14, cursor: "pointer", transition: "border-color .12s, transform .08s", display: "flex", flexDirection: "column", gap: 12 }}
          onMouseEnter={(e) => { e.currentTarget.style.borderColor = "var(--line-strong)"; e.currentTarget.style.transform = "translateY(-2px)"; }}
          onMouseLeave={(e) => { e.currentTarget.style.borderColor = "var(--line-soft)"; e.currentTarget.style.transform = "none"; }}>
          <div style={{ display: "flex", gap: 12 }}>
            <Thumb cat={p.category} size={56} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600, lineHeight: 1.25, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}><HL text={p.name} q={query} /></div>
              <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)", marginTop: 3 }}><HL text={p.sku} q={query} /></div>
            </div>
            <StatusBadge status={p._status} dotOnly />
          </div>
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
              <span style={{ fontSize: 11, color: "var(--ink-3)" }}>On hand{wh !== "all" ? " · " + DATA.WAREHOUSES.find(w => w.id === wh).short : ""}</span>
              <span className="mono tnum" style={{ fontSize: 16, fontWeight: 700 }}>{p._total}<span style={{ fontSize: 11, color: "var(--ink-3)", fontWeight: 400 }}> u</span></span>
            </div>
            <StockBar value={p._total} reorder={p._reorder} />
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 7, fontSize: 11, color: "var(--ink-3)" }}>
              <span>Reorder @ {Math.round(p._reorder)}</span>
              <span>{p.onOrder ? <span style={{ color: "var(--accent-text)" }}>+{p.onOrder} inbound</span> : money(p.price)}</span>
            </div>
          </div>
        </div>
      ))}
      {items.length === 0 && <div style={{ gridColumn: "1/-1" }}><Empty /></div>}
    </div>
  );
}

function Empty() {
  return (
    <div style={{ padding: "56px 20px", textAlign: "center", color: "var(--ink-3)" }}>
      <Icon name="search" size={26} style={{ color: "var(--ink-4)", marginBottom: 10 }} />
      <div style={{ fontSize: 14, fontWeight: 600, color: "var(--ink-2)" }}>No products match</div>
      <div style={{ fontSize: 12.5, marginTop: 3 }}>Try a different term or clear the filters.</div>
    </div>
  );
}

Object.assign(window, { useInventory, Toolbar, LedgerView, BoardView, CommandPlaceholder: null, Empty });

</script>

<script type="text/babel">
/* inventory-command.jsx — KPI strip, Direction C (Command/Health center),
   and the InventoryScreen wrapper that switches between all 3 directions.
   Exports to window: InventoryScreen */
const { useState: useStateIC, useMemo: useMemoIC } = React;

/* ---------- gauge (radial) ---------- */
function Gauge({ pct, color, size = 58, label, value, sub }) {
  const r = size / 2 - 5, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
      <div style={{ position: "relative", width: size, height: size, flex: "none" }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line)" strokeWidth="5" />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="5" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={off} style={{ transition: "stroke-dashoffset .6s ease" }} />
        </svg>
        <div className="mono tnum" style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size < 56 ? 13 : 15, fontWeight: 700 }}>{value}</div>
      </div>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--ink)" }}>{label}</div>
        <div style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{sub}</div>
      </div>
    </div>
  );
}

/* ---------- KPI strip (shared) ---------- */
function computeKpis() {
  const ps = DATA.PRODUCTS;
  const value = ps.reduce((s, p) => s + p.cost * p.total, 0);
  const skus = ps.length;
  const attention = ps.filter((p) => { const st = statusFromTotal(p.total, p.reorder * 2); return st === "out" || st === "low"; }).length;
  const inbound = DATA.POS.filter(po => po.status !== "Received" && po.status !== "Draft").reduce((s, po) => s + po.lines.reduce((a, l) => a + (l.qty - l.recv), 0), 0);
  const healthy = ps.filter((p) => statusFromTotal(p.total, p.reorder * 2) === "ok").length;
  const health = Math.round((healthy / skus) * 100);
  return { value, skus, attention, inbound, health };
}

function KpiStrip({ rev }) {
  const k = useMemoIC(computeKpis, [rev]);
  const tiles = [
    { label: "Inventory value", value: money(k.value), sub: "at cost · 3 locations", icon: "tag", c: "var(--ink-2)" },
    { label: "Active SKUs", value: num(k.skus), sub: "across 10 categories", icon: "box", c: "var(--ink-2)" },
    { label: "Needs attention", value: num(k.attention), sub: "out or below reorder", icon: "alert", c: "var(--low)" },
    { label: "Inbound units", value: num(k.inbound), sub: "on open POs", icon: "truck", c: "var(--accent-text)" },
  ];
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12 }}>
      {tiles.map((t) => (
        <div key={t.label} className="card" style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 3 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7, color: "var(--ink-3)", fontSize: 11.5, fontWeight: 600 }}>
            <Icon name={t.icon} size={14} style={{ color: t.c }} />{t.label}
          </div>
          <div className="mono tnum" style={{ fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em", color: t.c === "var(--low)" || t.c === "var(--accent-text)" ? t.c : "var(--ink)" }}>{t.value}</div>
          <div style={{ fontSize: 11, color: "var(--ink-4)" }}>{t.sub}</div>
        </div>
      ))}
    </div>
  );
}

/* ============ DIRECTION C — COMMAND / HEALTH ============ */
function CommandView({ items, query, wh, onOpen, onAddPO, rev }) {
  const k = useMemoIC(computeKpis, [rev]);
  // reorder queue: items needing attention, prioritized
  const queue = items.filter((p) => p._status === "out" || p._status === "low").slice(0, 7);
  const valueByCat = useMemoIC(() => {
    const m = {};
    DATA.PRODUCTS.forEach((p) => { m[p.category] = (m[p.category] || 0) + p.cost * p.total; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 6);
  }, [rev]);
  const maxCat = Math.max(...valueByCat.map((c) => c[1]), 1);

  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 300px", gap: 16, marginTop: 16, alignItems: "start" }} className="cmd-grid">
      {/* priority feed */}
      <div className="card" style={{ overflow: "hidden" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "13px 16px", borderBottom: "1px solid var(--line-soft)" }}>
          <Icon name="cmd" size={15} style={{ color: "var(--accent-text)" }} />
          <span style={{ fontWeight: 700, fontSize: 13.5 }}>Triage feed</span>
          <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>priority-ranked · act inline</span>
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: "var(--ink-3)" }} className="mono">{items.length} shown</span>
        </div>
        <div>
          {items.slice(0, 40).map((p) => (
            <div key={p.sku} onClick={() => onOpen(p)} className="cmd-row"
              style={{ display: "flex", alignItems: "center", gap: 13, padding: "10px 16px", borderBottom: "1px solid var(--line-soft)", cursor: "pointer", position: "relative" }}
              onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"}
              onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <span className={"dot " + p._status} style={{ width: 9, height: 9 }} />
              <Thumb cat={p.category} size={36} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}><HL text={p.name} q={query} /></div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}><HL text={p.sku} q={query} /> · {p.brand}</div>
              </div>
              <div style={{ width: 90, flex: "none" }}>
                <StockBar value={p._total} reorder={p._reorder} />
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4, fontSize: 10.5, color: "var(--ink-3)" }} className="mono">
                  <span>{p._total}u</span><span>R{Math.round(p._reorder)}</span>
                </div>
              </div>
              <div style={{ width: 72, textAlign: "right", flex: "none" }}>
                <StatusBadge status={p._status} />
              </div>
              {(p._status === "out" || p._status === "low") && (
                <button className="btn sm primary cmd-add" onClick={(e) => { e.stopPropagation(); onAddPO(p); }}
                  style={{ flex: "none" }}><Icon name="plus" size={13} />PO</button>
              )}
            </div>
          ))}
          {items.length === 0 && <Empty />}
        </div>
      </div>

      {/* health rail */}
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }} className="cmd-rail">
        <div className="card" style={{ padding: 16, display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{ fontWeight: 700, fontSize: 13 }}>Stock health</div>
          <Gauge pct={k.health} value={k.health + "%"} color="var(--ok)" label="Healthy SKUs" sub={k.skus - k.attention + " of " + k.skus + " in good shape"} size={64} />
          <div className="hr" />
          <Gauge pct={Math.min(100, (k.attention / k.skus) * 100 * 2)} value={k.attention} color="var(--low)" label="Need reorder" sub="out or below threshold" size={64} />
          <div className="hr" />
          <Gauge pct={Math.min(100, (k.inbound / 80) * 100)} value={k.inbound} color="var(--accent)" label="Inbound units" sub="on the way" size={64} />
        </div>

        <div className="card" style={{ padding: 16 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <span style={{ fontWeight: 700, fontSize: 13 }}>Reorder queue</span>
            <span className="badge low" style={{ fontSize: 10.5 }}>{queue.length}</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {queue.map((p) => (
              <div key={p.sku} style={{ display: "flex", alignItems: "center", gap: 9 }}>
                <span className={"dot " + p._status} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                </div>
                <button className="btn icon sm" onClick={() => onAddPO(p)} title="Add to PO" style={{ width: 26, height: 26 }}><Icon name="plus" size={13} /></button>
              </div>
            ))}
            {queue.length === 0 && <div style={{ fontSize: 12, color: "var(--ink-3)" }}>Nothing below threshold 🎉</div>}
          </div>

        <div className="card" style={{ padding: 16 }}>

}
