<script type="text/babel">
/* accounting.jsx — double-entry accounting: overview (P&L + balance sheet),
   chart of accounts, journal, AR, AP, trial balance. Reads DATA.JOURNAL.
   Exports: AccountingScreen */
const { useState: useStateAcc, useMemo: useMemoAcc } = React;

const TYPE_ORDER = ["Asset", "Liability", "Equity", "Income", "Expense"];

function AccountingScreen({ rev, onPrint }) {
  const [tab, setTab] = useStateAcc("overview");
  const led = useMemoAcc(() => {
    const rows = DATA.ACCOUNTS.map((a) => {
      const { dr, cr } = DATA.acctBalanceRaw(a.code);
      const bal = DATA.acctBalance(a.code);
      return { ...a, dr, cr, bal };
    });
    const sum = (t) => rows.filter((r) => r.type === t).reduce((s, r) => s + r.bal, 0);
    const assets = sum("Asset"), liab = sum("Liability"), equity = sum("Equity");
    const income = sum("Income"), expense = sum("Expense");
    const net = income - expense;
    const totalDr = rows.reduce((s, r) => s + r.dr, 0), totalCr = rows.reduce((s, r) => s + r.cr, 0);
    return { rows, assets, liab, equity, income, expense, net, totalDr, totalCr };
  }, [rev]);

  const printableTab = { pl: { variant: "pl", title: "Profit & Loss" }, balance: { variant: "balance", title: "Balance Sheet" }, trial: { variant: "trial", title: "Trial Balance" } }[tab];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, animation: "fadeIn .2s ease both" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <Segmented value={tab} onChange={setTab} options={[
          { value: "overview", label: "Overview" }, { value: "pl", label: "P&L" }, { value: "balance", label: "Balance sheet" },
          { value: "coa", label: "Accounts" }, { value: "journal", label: "Journal" }, { value: "ar", label: "AR" }, { value: "ap", label: "AP" }, { value: "trial", label: "Trial balance" },
        ]} />
        {printableTab && (
          <button className="btn sm" style={{ marginLeft: "auto" }} onClick={() => onPrint && onPrint({ kind: "statement", variant: printableTab.variant, title: printableTab.title, data: led })}>
            <Icon name="receipt" size={14} />Print / PDF
          </button>
        )}
      </div>
      {tab === "overview" && <Overview led={led} onPrint={onPrint} />}
      {tab === "pl" && <PL led={led} />}
      {tab === "balance" && <BalanceSheet led={led} />}
      {tab === "coa" && <CoA led={led} />}
      {tab === "journal" && <JournalView />}
      {tab === "ar" && <ARView />}
      {tab === "ap" && <APView />}
      {tab === "trial" && <TrialBalance led={led} onPrint={onPrint} />}
    </div>
  );
}

function Overview({ led, onPrint }) {
  const ar = DATA.CUSTOMERS.reduce((s, c) => s + c.balance, 0);
  const tiles = [
    { label: "Cash & bank", value: money(DATA.acctBalance("1000") + DATA.acctBalance("1010")), c: "var(--ink)", icon: "chart" },
    { label: "Accounts receivable", value: money(led.rows.find(r => r.code === "1100").bal), c: "var(--watch)", icon: "arrowR" },
    { label: "Accounts payable", value: money(led.rows.find(r => r.code === "2000").bal), c: "var(--low)", icon: "truck" },
    { label: "Net income (period)", value: money(led.net), c: led.net >= 0 ? "var(--ok)" : "var(--out)", icon: "gauge" },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12 }}>
        {tiles.map((t) => (
          <div key={t.label} className="card" style={{ padding: "14px 16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, color: "var(--ink-3)", fontSize: 11.5, fontWeight: 600, marginBottom: 4 }}><Icon name={t.icon} size={14} style={{ color: t.c }} />{t.label}</div>
            <div className="mono tnum" style={{ fontSize: 23, fontWeight: 700, color: t.c }}>{t.value}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px,1fr))", gap: 16, alignItems: "start" }}>
        <PL led={led} compact onPrint={onPrint} />
        <BalanceSheet led={led} compact onPrint={onPrint} />
      </div>
    </div>
  );
}

function StatementCard({ title, badge, onPrint, printVariant, printLed, children }) {
  return (
    <div className="card" style={{ overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "13px 16px", borderBottom: "1px solid var(--line-soft)" }}>
        <span style={{ fontWeight: 700, fontSize: 13.5 }}>{title}</span>
        {badge && <span className="badge neutral" style={{ marginLeft: "auto", fontSize: 10.5 }}>{badge}</span>}
        {onPrint && printVariant && <button className="btn ghost sm" style={{ marginLeft: badge ? 0 : "auto", color: "var(--accent-text)" }} onClick={() => onPrint({ kind: "statement", variant: printVariant, title, data: printLed })}><Icon name="receipt" size={12} />Print</button>}
      </div>
      <div style={{ padding: "8px 16px 16px" }}>{children}</div>
    </div>
  );
}
const Line2 = ({ l, v, bold, indent, color, top }) => (
  <div style={{ display: "flex", justifyContent: "space-between", padding: bold ? "9px 0" : "5px 0", paddingLeft: indent ? 14 : 0, fontSize: bold ? 14 : 13, fontWeight: bold ? 700 : 400, color: color || (bold ? "var(--ink)" : "var(--ink-2)"), borderTop: top ? "1px solid var(--line-soft)" : "none", marginTop: top ? 4 : 0 }}>
    <span>{l}</span><span className="mono tnum">{v}</span>
  </div>
);

function PL({ led, compact, onPrint }) {
  const inc = led.rows.filter((r) => r.type === "Income" && r.bal !== 0);
  const exp = led.rows.filter((r) => r.type === "Expense" && r.bal !== 0);
  return (
    <StatementCard title="Profit & Loss" badge="period to date" onPrint={onPrint} printVariant="pl" printLed={led}>
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", padding: "6px 0 2px" }}>Revenue</div>
      {inc.map((r) => <Line2 key={r.code} l={r.name} v={money(r.bal)} indent />)}
      <Line2 l="Total revenue" v={money(led.income)} bold top />
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", padding: "12px 0 2px" }}>Expenses</div>
      {exp.map((r) => <Line2 key={r.code} l={r.name} v={money(r.bal)} indent />)}
      <Line2 l="Total expenses" v={money(led.expense)} bold top />
      <Line2 l="Net income" v={money(led.net)} bold top color={led.net >= 0 ? "var(--ok)" : "var(--out)"} />
    </StatementCard>
  );
}

function BalanceSheet({ led, compact, onPrint }) {
  const a = led.rows.filter((r) => r.type === "Asset" && r.bal !== 0);
  const l = led.rows.filter((r) => r.type === "Liability" && r.bal !== 0);
  const e = led.rows.filter((r) => r.type === "Equity" && r.bal !== 0);
  const totalEquity = led.equity + led.net;
  const balanced = Math.abs(led.assets - (led.liab + totalEquity)) < 1;
  return (
    <StatementCard title="Balance sheet" badge={balanced ? "balanced ✓" : "out of balance"} onPrint={onPrint} printVariant="balance" printLed={led}>
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", padding: "6px 0 2px" }}>Assets</div>
      {a.map((r) => <Line2 key={r.code} l={r.name} v={money(r.bal)} indent />)}
      <Line2 l="Total assets" v={money(led.assets)} bold top />
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", padding: "12px 0 2px" }}>Liabilities</div>
      {l.map((r) => <Line2 key={r.code} l={r.name} v={money(r.bal)} indent />)}
      <Line2 l="Total liabilities" v={money(led.liab)} bold top />
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-4)", textTransform: "uppercase", padding: "12px 0 2px" }}>Equity</div>
      {e.map((r) => <Line2 key={r.code} l={r.name} v={money(r.bal)} indent />)}
      <Line2 l="Retained earnings (period)" v={money(led.net)} indent />
      <Line2 l="Liabilities + equity" v={money(led.liab + totalEquity)} bold top />
    </StatementCard>
  );
}

function CoA({ led }) {
  return (
    <div className="card" style={{ overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
          <thead><tr style={{ background: "var(--bg-2)", borderBottom: "1px solid var(--line)" }}>
            {["Code", "Account", "Type", "Balance"].map((h, i) => <th key={h} style={{ textAlign: i === 3 ? "right" : "left", padding: "10px 14px", fontSize: 10.5, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-3)", textTransform: "uppercase" }}>{h}</th>)}
          </tr></thead>
          <tbody>
            {TYPE_ORDER.map((type) => {
              const rows = led.rows.filter((r) => r.type === type);
              return [
                <tr key={type + "h"} style={{ background: "var(--bg)" }}><td colSpan={4} style={{ padding: "7px 14px", fontSize: 11, fontWeight: 700, letterSpacing: ".05em", color: "var(--accent-text)", textTransform: "uppercase" }}>{type}</td></tr>,
                ...rows.map((r) => (
                  <tr key={r.code} style={{ borderBottom: "1px solid var(--line-soft)" }}>
                    <td className="mono" style={{ padding: "9px 14px", fontSize: 12.5, color: "var(--ink-3)" }}>{r.code}</td>
                    <td style={{ padding: "9px 14px", fontSize: 13, fontWeight: 500 }}>{r.name}</td>
                    <td style={{ padding: "9px 14px" }}><span className="badge neutral" style={{ fontSize: 10 }}>{r.type}</span></td>
                    <td className="mono tnum" style={{ padding: "9px 14px", textAlign: "right", fontSize: 13, fontWeight: 600 }}>{money(r.bal)}</td>
                  </tr>
                )),
              ];
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const KIND_CLR = { Sale: "ok", Receipt: "accent", Payment: "watch", Expense: "low", Adjustment: "out", Opening: "neutral" };
function JournalView() {
  const [open, setOpen] = useStateAcc(null);
  const entries = [...DATA.JOURNAL].sort((a, b) => a.days - b.days);
  return (
    <div className="card" style={{ overflow: "hidden" }}>
      {entries.map((e) => {
        const dr = e.lines.reduce((s, l) => s + l.debit, 0);
        const isOpen = open === e.id;
        return (
          <div key={e.id} style={{ borderBottom: "1px solid var(--line-soft)" }}>
            <div onClick={() => setOpen(isOpen ? null : e.id)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 16px", cursor: "pointer" }}
              onMouseEnter={(ev) => ev.currentTarget.style.background = "var(--panel-2)"} onMouseLeave={(ev) => ev.currentTarget.style.background = "transparent"}>
              <Icon name={isOpen ? "chevD" : "chevR"} size={13} style={{ color: "var(--ink-4)" }} />
              <span className={"badge " + (KIND_CLR[e.kind] || "neutral")} style={{ fontSize: 10, width: 78, justifyContent: "center" }}>{e.kind}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{e.memo}</div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{e.id} · {e.ref} · {ago(e.days)}</div>
              </div>
              <span className="mono tnum" style={{ fontSize: 13, fontWeight: 700 }}>{money(dr)}</span>
            </div>
            {isOpen && (
              <div style={{ padding: "4px 16px 12px 54px", background: "var(--bg-2)" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr>{["Account", "Debit", "Credit"].map((h, i) => <th key={h} style={{ textAlign: i ? "right" : "left", padding: "6px 8px", fontSize: 10, color: "var(--ink-4)", fontWeight: 700, textTransform: "uppercase" }}>{h}</th>)}</tr></thead>
                  <tbody>
                    {e.lines.map((l, i) => {
                      const acct = DATA.acct(l.account);
                      return (
                        <tr key={i}>
                          <td style={{ padding: "5px 8px", fontSize: 12.5 }}><span className="mono" style={{ color: "var(--ink-3)" }}>{l.account}</span> {acct ? acct.name : ""}</td>
                          <td className="mono tnum" style={{ padding: "5px 8px", textAlign: "right", fontSize: 12.5, color: l.debit ? "var(--ink)" : "var(--ink-4)" }}>{l.debit ? money(l.debit) : "—"}</td>
                          <td className="mono tnum" style={{ padding: "5px 8px", textAlign: "right", fontSize: 12.5, color: l.credit ? "var(--ink)" : "var(--ink-4)" }}>{l.credit ? money(l.credit) : "—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function bucketFor(c) {
  // deterministic aging bucket from id
  const n = parseInt(c.id.replace(/\D/g, "")) % 4;
  return ["Current", "1–30", "31–60", "60+"][n];
}
function ARView() {
  const accts = DATA.CUSTOMERS.filter((c) => c.balance > 0);
  const total = accts.reduce((s, c) => s + c.balance, 0);
  const buckets = { "Current": 0, "1–30": 0, "31–60": 0, "60+": 0 };
  accts.forEach((c) => buckets[bucketFor(c)] += c.balance);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10 }}>
        {Object.entries(buckets).map(([k, v]) => (
          <div key={k} className="card" style={{ padding: "12px 14px" }}>
            <div style={{ fontSize: 11, color: "var(--ink-3)" }}>{k}{k !== "Current" ? " days" : ""}</div>
            <div className="mono tnum" style={{ fontSize: 18, fontWeight: 700, color: k === "60+" ? "var(--out)" : k === "31–60" ? "var(--low)" : "var(--ink)" }}>{money(v)}</div>
          </div>
        ))}
      </div>
      <div className="card" style={{ overflow: "hidden" }}>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
            <thead><tr style={{ background: "var(--bg-2)", borderBottom: "1px solid var(--line)" }}>
              {["Customer", "Terms", "Credit limit", "Aging", "Balance"].map((h, i) => <th key={h} style={{ textAlign: i >= 2 ? "right" : "left", padding: "10px 14px", fontSize: 10.5, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-3)", textTransform: "uppercase" }}>{h}</th>)}
            </tr></thead>
            <tbody>
              {accts.map((c) => {
                const b = bucketFor(c);
                return (
                  <tr key={c.id} style={{ borderBottom: "1px solid var(--line-soft)" }}>
                    <td style={{ padding: "10px 14px" }}><div style={{ display: "flex", alignItems: "center", gap: 10 }}><Avatar name={c.name} size={28} /><div><div style={{ fontSize: 13, fontWeight: 600 }}>{c.name}</div><div className="mono" style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{c.id}</div></div></div></td>
                    <td style={{ padding: "10px 14px", fontSize: 12.5, color: "var(--ink-2)" }}>{c.terms}</td>
                    <td className="mono tnum" style={{ padding: "10px 14px", textAlign: "right", fontSize: 12.5, color: "var(--ink-3)" }}>{money(c.creditLimit)}</td>
                    <td style={{ padding: "10px 14px", textAlign: "right" }}><span className={"badge " + (b === "60+" ? "out" : b === "31–60" ? "low" : b === "1–30" ? "watch" : "ok")} style={{ fontSize: 10 }}>{b}</span></td>
                    <td className="mono tnum" style={{ padding: "10px 14px", textAlign: "right", fontSize: 13.5, fontWeight: 700 }}>{money(c.balance)}</td>
                  </tr>
                );
              })}
              <tr style={{ background: "var(--bg-2)" }}><td colSpan={4} style={{ padding: "10px 14px", fontSize: 13, fontWeight: 700 }}>Total receivable</td><td className="mono tnum" style={{ padding: "10px 14px", textAlign: "right", fontSize: 14, fontWeight: 700 }}>{money(total)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function APView() {
  // AP from received PO value per supplier (received cost), minus assumed paid
  const bySup = {};
  DATA.POS.forEach((po) => {
    const recvVal = po.lines.reduce((s, l) => s + l.recv * l.cost, 0);
    if (recvVal > 0 && po.status !== "Draft") (bySup[po.supplierId] = bySup[po.supplierId] || { val: 0, pos: [] }).val += recvVal, bySup[po.supplierId].pos.push(po.id);
  });
  const rows = Object.entries(bySup).map(([sid, d]) => ({ sup: DATA.SUPPLIERS.find((s) => s.id === sid), ...d }));
  const total = rows.reduce((s, r) => s + r.val, 0);
  return (
    <div className="card" style={{ overflow: "hidden" }}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 560 }}>
          <thead><tr style={{ background: "var(--bg-2)", borderBottom: "1px solid var(--line)" }}>
            {["Supplier", "Terms", "POs", "Payable"].map((h, i) => <th key={h} style={{ textAlign: i >= 2 ? "right" : "left", padding: "10px 14px", fontSize: 10.5, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-3)", textTransform: "uppercase" }}>{h}</th>)}
          </tr></thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.sup.id} style={{ borderBottom: "1px solid var(--line-soft)" }}>
                <td style={{ padding: "10px 14px", fontSize: 13, fontWeight: 600 }}>{r.sup.name}</td>
                <td style={{ padding: "10px 14px", fontSize: 12.5, color: "var(--ink-2)" }}>{r.sup.terms}</td>
                <td className="mono" style={{ padding: "10px 14px", textAlign: "right", fontSize: 12, color: "var(--ink-3)" }}>{r.pos.length}</td>
                <td className="mono tnum" style={{ padding: "10px 14px", textAlign: "right", fontSize: 13.5, fontWeight: 700 }}>{money(r.val)}</td>
              </tr>
            ))}
            <tr style={{ background: "var(--bg-2)" }}><td colSpan={3} style={{ padding: "10px 14px", fontSize: 13, fontWeight: 700 }}>Total payable</td><td className="mono tnum" style={{ padding: "10px 14px", textAlign: "right", fontSize: 14, fontWeight: 700 }}>{money(total)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function TrialBalance({ led, onPrint }) {
  const rows = led.rows.filter((r) => r.dr !== 0 || r.cr !== 0).map((r) => {
    const net = r.dr - r.cr;
    return { ...r, debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 };
  });
  const td = rows.reduce((s, r) => s + r.debit, 0), tc = rows.reduce((s, r) => s + r.credit, 0);
  const balanced = Math.abs(td - tc) < 1;
  return (
    <div className="card" style={{ overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "13px 16px", borderBottom: "1px solid var(--line-soft)" }}>
        <span style={{ fontWeight: 700, fontSize: 13.5 }}>Trial balance</span>
        <span className={"badge " + (balanced ? "ok" : "out")} style={{ marginLeft: "auto", fontSize: 10.5 }}>{balanced ? "Balanced ✓" : "Out of balance"}</span>
        {onPrint && <button className="btn ghost sm" style={{ color: "var(--accent-text)" }} onClick={() => onPrint({ kind: "statement", variant: "trial", title: "Trial Balance", data: led })}><Icon name="receipt" size={12} />Print</button>}
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 520 }}>
          <thead><tr style={{ background: "var(--bg-2)", borderBottom: "1px solid var(--line)" }}>
            {["Code", "Account", "Debit", "Credit"].map((h, i) => <th key={h} style={{ textAlign: i >= 2 ? "right" : "left", padding: "10px 14px", fontSize: 10.5, fontWeight: 700, letterSpacing: ".05em", color: "var(--ink-3)", textTransform: "uppercase" }}>{h}</th>)}
          </tr></thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.code} style={{ borderBottom: "1px solid var(--line-soft)" }}>
                <td className="mono" style={{ padding: "8px 14px", fontSize: 12, color: "var(--ink-3)" }}>{r.code}</td>
                <td style={{ padding: "8px 14px", fontSize: 12.5 }}>{r.name}</td>
                <td className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 12.5, color: r.debit ? "var(--ink)" : "var(--ink-4)" }}>{r.debit ? money(r.debit) : "—"}</td>
                <td className="mono tnum" style={{ padding: "8px 14px", textAlign: "right", fontSize: 12.5, color: r.credit ? "var(--ink)" : "var(--ink-4)" }}>{r.credit ? money(r.credit) : "—"}</td>
              </tr>
            ))}
            <tr style={{ background: "var(--bg-2)", borderTop: "2px solid var(--line)" }}>
              <td colSpan={2} style={{ padding: "11px 14px", fontSize: 13, fontWeight: 700 }}>Totals</td>
              <td className="mono tnum" style={{ padding: "11px 14px", textAlign: "right", fontSize: 14, fontWeight: 700 }}>{money(td)}</td>
              <td className="mono tnum" style={{ padding: "11px 14px", textAlign: "right", fontSize: 14, fontWeight: 700 }}>{money(tc)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

Object.assign(window, { AccountingScreen });

</script>

<script type="text/babel">
/* reports.jsx — Reports module: sales, inventory valuation, stock health,
   purchasing & receivables. Computes from live DATA. Exports: ReportsScreen */
const { useState: useStateRpt, useMemo: useMemoRpt } = React;

function BarList({ rows, color, fmt }) {
  const max = Math.max(...rows.map((r) => r.v), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {rows.map((r) => (
        <div key={r.k}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
            <span style={{ color: "var(--ink-2)" }}>{r.k}</span>
            <span className="mono tnum" style={{ color: "var(--ink-3)" }}>{(fmt || money)(r.v)}</span>
          </div>
          <div style={{ height: 7, background: "var(--bg)", borderRadius: 99, overflow: "hidden", border: "1px solid var(--line-soft)" }}>
            <div style={{ height: "100%", width: (r.v / max * 100) + "%", background: color || "var(--accent)", borderRadius: 99, opacity: 0.85, transition: "width .5s" }} />
          </div>
        </div>
      ))}
    </div>
  );
}

function RCard({ title, icon, sub, action, children, span }) {
  return (
    <div className="card" style={{ overflow: "hidden", gridColumn: span ? "1 / -1" : "auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "13px 16px", borderBottom: "1px solid var(--line-soft)" }}>
        <Icon name={icon} size={15} style={{ color: "var(--accent-text)" }} />
        <span style={{ fontWeight: 700, fontSize: 13.5 }}>{title}</span>
        {sub && <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{sub}</span>}
        {action && <span style={{ marginLeft: "auto" }}>{action}</span>}
      </div>
      <div style={{ padding: 16 }}>{children}</div>
    </div>
  );
}

function ReportsScreen({ rev, toast, onPrint }) {
  const [period, setPeriod] = useStateRpt("mtd");
  const data = useMemoRpt(() => {
    // sales from movements
    const salesByCat = {}, salesByWh = {};
    let unitsSold = 0, salesRevenue = 0;
    DATA.MOVEMENTS.filter((m) => m.type === "Sale").forEach((m) => {
      const p = DATA.pid(m.sku); if (!p) return;
      const u = Math.abs(m.qty); unitsSold += u;
      const revv = u * p.price;
      salesRevenue += revv;
      salesByCat[p.category] = (salesByCat[p.category] || 0) + revv;
      const wn = (DATA.WAREHOUSES.find((w) => w.id === m.wh) || {}).short || m.wh;
      salesByWh[wn] = (salesByWh[wn] || 0) + revv;
    });
    // top products by sales revenue
    const prodRev = {};
    DATA.MOVEMENTS.filter((m) => m.type === "Sale").forEach((m) => { const p = DATA.pid(m.sku); if (p) prodRev[p.sku] = (prodRev[p.sku] || 0) + Math.abs(m.qty) * p.price; });
    const topProducts = Object.entries(prodRev).map(([sku, v]) => ({ p: DATA.pid(sku), v })).sort((a, b) => b.v - a.v).slice(0, 6);
    // inventory valuation
    let costVal = 0, retailVal = 0; const valByCat = {};
    DATA.PRODUCTS.forEach((p) => { costVal += p.cost * p.total; retailVal += p.price * p.total; valByCat[p.category] = (valByCat[p.category] || 0) + p.cost * p.total; });
    // stock health
    const health = { ok: 0, watch: 0, low: 0, out: 0 };
    DATA.PRODUCTS.forEach((p) => health[statusFromTotal(p.total, p.reorder * 2)]++);
    // purchasing: spend by supplier (received), open commitment
    const spend = {}; let openCommit = 0;
    DATA.POS.forEach((po) => {
      po.lines.forEach((l) => { spend[po.supplierId] = (spend[po.supplierId] || 0) + l.recv * l.cost; });
      if (po.status === "Open" || po.status === "Partial") openCommit += po.lines.reduce((s, l) => s + (l.qty - l.recv) * l.cost, 0);
    });
    const supplierSpend = Object.entries(spend).filter(([, v]) => v > 0).map(([id, v]) => ({ k: (DATA.SUPPLIERS.find((s) => s.id === id) || {}).name, v })).sort((a, b) => b.v - a.v);
    const ar = DATA.CUSTOMERS.reduce((s, c) => s + c.balance, 0);
    return {
      unitsSold, salesRevenue, costVal, retailVal, health, openCommit, ar,
      catRows: Object.entries(salesByCat).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v),
      whRows: Object.entries(salesByWh).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v),
      valRows: Object.entries(valByCat).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v).slice(0, 6),
      topProducts, supplierSpend,
    };
  }, [rev]);

  const grossMargin = data.retailVal > 0 ? Math.round((data.retailVal - data.costVal) / data.retailVal * 100) : 0;

  const kpis = [
    { label: "Sales revenue", value: money(data.salesRevenue), sub: "recorded movements", c: "var(--ok)", icon: "chart" },
    { label: "Units sold", value: num(data.unitsSold), sub: "across all stores", c: "var(--ink)", icon: "box" },
    { label: "Gross margin", value: grossMargin + "%", sub: "blended at retail", c: "var(--accent-text)", icon: "gauge" },
    { label: "Open PO commitment", value: money(data.openCommit), sub: "inbound at cost", c: "var(--watch)", icon: "truck" },
  ];

  const exportBtn = (name, tableRows, cols) => (
    <button className="btn ghost sm" style={{ color: "var(--accent-text)" }}
      onClick={() => {
        if (onPrint) {
          onPrint({ kind: "report", title: name, data: { title: name, kpis: kpis.map(k => ({ label: k.label, value: k.value })), tables: tableRows && cols ? [{ title: name, cols, rows: tableRows }] : [] } });
        } else {
          toast && toast(name + " exported", "ok");
        }
      }}><Icon name="arrowR" size={12} />Export</button>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, animation: "fadeIn .2s ease both" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <Segmented value={period} onChange={setPeriod} options={[{ value: "wtd", label: "Week" }, { value: "mtd", label: "Month" }, { value: "qtd", label: "Quarter" }, { value: "ytd", label: "Year" }]} />
        <span style={{ fontSize: 12, color: "var(--ink-3)" }}>Period to date · all locations</span>
        <button className="btn sm" style={{ marginLeft: "auto" }} onClick={() => {
          if (onPrint) {
            onPrint({ kind: "report", title: "Business Report Pack", data: {
              title: "Business Report Pack",
              kpis: kpis.map(k => ({ label: k.label, value: k.value })),
              tables: [
                { title: "Sales by Category", cols: ["Category", "Revenue"], rows: data.catRows.map(r => [r.k, "₱" + Math.round(r.v).toLocaleString()]) },
                { title: "Top Products", cols: ["Product", "Revenue"], rows: data.topProducts.map(r => [r.p.name, "₱" + Math.round(r.v).toLocaleString()]) },
                { title: "Supplier Spend", cols: ["Supplier", "Received (cost)"], rows: data.supplierSpend.map(r => [r.k, "₱" + Math.round(r.v).toLocaleString()]) },
              ]
            }});
          } else {
            toast && toast("Full report pack exported (PDF)", "ok");
          }
        }}><Icon name="receipt" size={14} />Export pack</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))", gap: 12 }}>
        {kpis.map((t) => (
          <div key={t.label} className="card" style={{ padding: "14px 16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, color: "var(--ink-3)", fontSize: 11.5, fontWeight: 600, marginBottom: 4 }}><Icon name={t.icon} size={14} style={{ color: t.c }} />{t.label}</div>
            <div className="mono tnum" style={{ fontSize: 23, fontWeight: 700, color: t.c }}>{t.value}</div>
            <div style={{ fontSize: 11, color: "var(--ink-4)" }}>{t.sub}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px,1fr))", gap: 16, alignItems: "start" }}>
        <RCard title="Sales by category" icon="chart" action={exportBtn("Sales by category")}>
          <BarList rows={data.catRows} color="var(--accent)" />
        </RCard>

        <RCard title="Sales by location" icon="warehouse" action={exportBtn("Sales by location")}>
          <BarList rows={data.whRows} color="var(--ok)" />
        </RCard>

        <RCard title="Top products" icon="box" sub="by revenue" action={exportBtn("Top products")}>
          <div style={{ display: "flex", flexDirection: "column" }}>
            {data.topProducts.map(({ p, v }, i) => (
              <div key={p.sku} style={{ display: "flex", alignItems: "center", gap: 11, padding: "8px 0", borderBottom: i < data.topProducts.length - 1 ? "1px solid var(--line-soft)" : "none" }}>
                <span className="mono tnum" style={{ width: 18, color: "var(--ink-4)", fontSize: 12 }}>{i + 1}</span>
                <Thumb cat={p.category} size={32} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                  <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{p.sku}</div>
                </div>
                <span className="mono tnum" style={{ fontSize: 13, fontWeight: 700 }}>{money(v)}</span>
              </div>
            ))}
          </div>
        </RCard>

        <RCard title="Inventory valuation" icon="tag" action={exportBtn("Valuation")}>
          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            {[["At cost", money(data.costVal)], ["At retail", money(data.retailVal)], ["Margin", grossMargin + "%"]].map(([l, v]) => (
              <div key={l} style={{ flex: 1, padding: "9px 11px", borderRadius: 7, background: "var(--panel-2)" }}>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{l}</div>
                <div className="mono tnum" style={{ fontSize: 15, fontWeight: 700 }}>{v}</div>
              </div>
            ))}
          </div>
          <BarList rows={data.valRows} color="var(--accent)" />
        </RCard>

        <RCard title="Stock health" icon="gauge">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {[["ok", "Healthy"], ["watch", "Watch"], ["low", "Low"], ["out", "Out of stock"]].map(([k, label]) => (
              <div key={k} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 13px", borderRadius: 8, background: "var(--panel-2)" }}>
                <span className={"dot " + k} style={{ width: 10, height: 10 }} />
                <div style={{ flex: 1 }}>
                  <div className="mono tnum" style={{ fontSize: 20, fontWeight: 700, color: "var(--" + k + ")" }}>{data.health[k]}</div>
                  <div style={{ fontSize: 11, color: "var(--ink-3)" }}>{label}</div>
                </div>
              </div>
            ))}
          </div>
        </RCard>

        <RCard title="Supplier spend" icon="truck" sub="received at cost" action={exportBtn("Supplier spend")}>
          <BarList rows={data.supplierSpend} color="var(--watch)" />
        </RCard>
      </div>
    </div>
  );
}

Object.assign(window, { ReportsScreen });

</script>

<script type="text/babel">
/* printdocs.jsx — PrintPreview modal + printable documents (receipt, PO,
   accounting statement, report). Renders on white "paper" and prints via the
   browser dialog (Save as PDF). Exports: PrintPreview */
const { useEffect: useEffectPD } = React;

const PD = {
  ink: "#15171c", muted: "#5b626d", faint: "#8a909a", line: "#e4e7ec",
  accent: "#4f46e5", ok: "#15803d", bad: "#b91c1c",
};
const pdMoney = (n) => "₱" + Math.round(n).toLocaleString("en-US");
const TODAY = new Date().toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });

function DocHead({ title, meta, badge }) {
  return (
    <div style={{ display: "flex", alignItems: "flex-start", borderBottom: "2px solid " + PD.ink, paddingBottom: 14, marginBottom: 18 }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: "-0.01em" }}>Everose Marketing Corp.</div>
        <div style={{ fontSize: 11, color: PD.muted, marginTop: 2 }}>Home Appliances &amp; Furniture · Iligan · Ozamis · Dumaguete</div>
      </div>
      <div style={{ textAlign: "right" }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: PD.accent }}>{title}</div>
        <div style={{ fontSize: 11, color: PD.muted, marginTop: 2 }}>{meta || TODAY}</div>
        {badge && <div style={{ fontSize: 10, fontWeight: 700, marginTop: 4, color: PD.muted }}>{badge}</div>}
      </div>
    </div>
  );
}
const Row = ({ cells, head, bold, w }) => (
  <div style={{ display: "flex", padding: head ? "0 0 6px" : "6px 0", borderBottom: head ? "1px solid " + PD.line : "1px solid " + PD.line, fontSize: head ? 10 : 12.5, fontWeight: head ? 700 : bold ? 700 : 400, color: head ? PD.faint : PD.ink, textTransform: head ? "uppercase" : "none", letterSpacing: head ? ".04em" : 0 }}>
    {cells.map((c, i) => <div key={i} style={{ flex: w ? w[i] : 1, textAlign: i === 0 ? "left" : "right", fontFamily: i === 0 ? "inherit" : "'IBM Plex Mono', monospace" }}>{c}</div>)}
  </div>
);

/* ---- Receipt ---- */
function ReceiptDoc({ data }) {
  return (
    <div>
      <DocHead title="Sales Receipt" meta={data.saleId + " · " + TODAY} badge={"Register: Ozamis City"} />
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 14 }}>
        <div><div style={{ color: PD.muted, fontSize: 10.5 }}>BILL TO</div><div style={{ fontWeight: 600 }}>{data.customer.name}</div>{data.customer.phone && data.customer.phone !== "—" && <div style={{ color: PD.muted }}>{data.customer.phone}</div>}</div>
        <div style={{ textAlign: "right" }}><div style={{ color: PD.muted, fontSize: 10.5 }}>CASHIER</div><div style={{ fontWeight: 600 }}>Dana Reyes</div></div>
      </div>
      <Row head cells={["Item", "Qty", "Price", "Amount"]} w={[5, 1, 2, 2]} />
      {data.cart.map((l) => <Row key={l.sku} w={[5, 1, 2, 2]} cells={[l.name + (l.install ? " + install" : ""), l.qty, pdMoney(l.price), pdMoney(l.price * l.qty + (l.install ? 79 : 0))]} />)}
      <div style={{ marginLeft: "auto", width: 240, marginTop: 12 }}>
        <Row cells={["Subtotal", pdMoney(data.subtotal)]} />
        {data.discount > 0 && <Row cells={["Discount", "−" + pdMoney(data.discount)]} />}
        <Row cells={["Tax (8%)", pdMoney(data.tax)]} />
        <Row bold cells={["TOTAL", pdMoney(data.total)]} />
        {data.payments.map((p, i) => <Row key={i} cells={[p.label, pdMoney(p.amount)]} />)}
        {data.change > 0 && <Row cells={["Change", pdMoney(data.change)]} />}
      </div>
      <div style={{ textAlign: "center", marginTop: 28, fontSize: 11, color: PD.muted }}>Thank you for your purchase! · Goods sold are covered by manufacturer warranty.</div>
    </div>
  );
}

/* ---- Purchase Order ---- */
function PODoc({ po }) {
  const sup = DATA.SUPPLIERS.find((s) => s.id === po.supplierId);
  const total = po.lines.reduce((s, l) => s + l.qty * l.cost, 0);
  return (
    <div>
      <DocHead title="Purchase Order" meta={po.id + " · " + TODAY} badge={"Status: " + po.status} />
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 14 }}>
        <div><div style={{ color: PD.muted, fontSize: 10.5 }}>SUPPLIER</div><div style={{ fontWeight: 600 }}>{sup.name}</div><div style={{ color: PD.muted }}>{sup.terms} · {sup.lead}d lead</div></div>
        <div style={{ textAlign: "right" }}><div style={{ color: PD.muted, fontSize: 10.5 }}>SHIP TO</div><div style={{ fontWeight: 600 }}>Main — Iligan City</div><div style={{ color: PD.muted }}>Distribution Center</div></div>
      </div>
      <Row head cells={["Product", "SKU", "Qty", "Unit cost", "Line total"]} w={[4, 2, 1, 2, 2]} />
      {po.lines.map((l) => { const p = DATA.pid(l.sku) || {}; return <Row key={l.sku} w={[4, 2, 1, 2, 2]} cells={[l.name || p.name, l.sku, l.qty, pdMoney(l.cost), pdMoney(l.qty * l.cost)]} />; })}
      <div style={{ marginLeft: "auto", width: 240, marginTop: 12 }}>
        <Row cells={["Units", po.lines.reduce((s, l) => s + l.qty, 0)]} />
        <Row bold cells={["ORDER TOTAL", pdMoney(total)]} />
      </div>
      <div style={{ marginTop: 32, display: "flex", gap: 40, fontSize: 11, color: PD.muted }}>
        <div style={{ flex: 1, borderTop: "1px solid " + PD.ink, paddingTop: 6 }}>Authorized by</div>
        <div style={{ flex: 1, borderTop: "1px solid " + PD.ink, paddingTop: 6 }}>Received by</div>
      </div>
    </div>
  );
}

/* ---- Accounting statement ---- */
function StatementDoc({ variant, led }) {
  if (variant === "pl") {
    const inc = led.rows.filter((r) => r.type === "Income" && r.bal !== 0);
    const exp = led.rows.filter((r) => r.type === "Expense" && r.bal !== 0);
    return (
      <div>
        <DocHead title="Profit &amp; Loss" meta={"Period to date · " + TODAY} />
        <Row head cells={["Account", "Amount"]} />
        <div style={{ fontSize: 10.5, color: PD.faint, fontWeight: 700, padding: "8px 0 2px" }}>REVENUE</div>
        {inc.map((r) => <Row key={r.code} cells={[r.name, pdMoney(r.bal)]} />)}
        <Row bold cells={["Total revenue", pdMoney(led.income)]} />
        <div style={{ fontSize: 10.5, color: PD.faint, fontWeight: 700, padding: "12px 0 2px" }}>EXPENSES</div>
        {exp.map((r) => <Row key={r.code} cells={[r.name, pdMoney(r.bal)]} />)}
        <Row bold cells={["Total expenses", pdMoney(led.expense)]} />
        <Row bold cells={["NET INCOME", pdMoney(led.net)]} />
      </div>
    );
  }
  if (variant === "balance") {
    const a = led.rows.filter((r) => r.type === "Asset" && r.bal !== 0);
    const l = led.rows.filter((r) => r.type === "Liability" && r.bal !== 0);
    const e = led.rows.filter((r) => r.type === "Equity" && r.bal !== 0);
    return (
      <div>
        <DocHead title="Balance Sheet" meta={"As of " + TODAY} />
        <div style={{ fontSize: 10.5, color: PD.faint, fontWeight: 700, padding: "4px 0 2px" }}>ASSETS</div>
        {a.map((r) => <Row key={r.code} cells={[r.name, pdMoney(r.bal)]} />)}
        <Row bold cells={["Total assets", pdMoney(led.assets)]} />
        <div style={{ fontSize: 10.5, color: PD.faint, fontWeight: 700, padding: "12px 0 2px" }}>LIABILITIES</div>
        {l.map((r) => <Row key={r.code} cells={[r.name, pdMoney(r.bal)]} />)}
        <Row bold cells={["Total liabilities", pdMoney(led.liab)]} />
        <div style={{ fontSize: 10.5, color: PD.faint, fontWeight: 700, padding: "12px 0 2px" }}>EQUITY</div>
        {e.map((r) => <Row key={r.code} cells={[r.name, pdMoney(r.bal)]} />)}
        <Row cells={["Retained earnings (period)", pdMoney(led.net)]} />
        <Row bold cells={["Liabilities + equity", pdMoney(led.liab + led.equity + led.net)]} />
      </div>
    );
  }
  // trial
  const rows = led.rows.filter((r) => r.dr !== 0 || r.cr !== 0).map((r) => { const net = r.dr - r.cr; return { ...r, debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 }; });
  const td = rows.reduce((s, r) => s + r.debit, 0), tc = rows.reduce((s, r) => s + r.credit, 0);
  return (
    <div>
      <DocHead title="Trial Balance" meta={"As of " + TODAY} />
      <Row head cells={["Code", "Account", "Debit", "Credit"]} w={[1.4, 4, 2, 2]} />
      {rows.map((r) => <Row key={r.code} w={[1.4, 4, 2, 2]} cells={[r.code, r.name, r.debit ? pdMoney(r.debit) : "—", r.credit ? pdMoney(r.credit) : "—"]} />)}
      <Row bold w={[1.4, 4, 2, 2]} cells={["", "TOTALS", pdMoney(td), pdMoney(tc)]} />
    </div>
  );
}

/* ---- Report pack ---- */
function ReportDoc({ data }) {
  return (
    <div>
      <DocHead title={data.title || "Business Report"} meta={"Period to date · " + TODAY} />
      {data.kpis && (
        <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap" }}>
          {data.kpis.map((k) => <div key={k.label} style={{ flex: "1 1 120px", border: "1px solid " + PD.line, borderRadius: 6, padding: "8px 10px" }}><div style={{ fontSize: 10, color: PD.muted }}>{k.label}</div><div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace" }}>{k.value}</div></div>)}
        </div>
      )}
      {(data.tables || []).map((t, ti) => (
        <div key={ti} style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>{t.title}</div>
          <Row head cells={t.cols} />
          {t.rows.map((r, ri) => <Row key={ri} cells={r} />)}
        </div>
      ))}
    </div>
  );
}

function PrintPreview({ doc, onClose }) {
  useEffectPD(() => {
    function esc(e) { if (e.key === "Escape") onClose(); }
    if (doc) document.addEventListener("keydown", esc);
    return () => document.removeEventListener("keydown", esc);
  }, [doc, onClose]);
  if (!doc) return null;
  const body =
    doc.kind === "receipt" ? <ReceiptDoc data={doc.data} /> :
    doc.kind === "po" ? <PODoc po={doc.data} /> :
    doc.kind === "statement" ? <StatementDoc variant={doc.variant} led={doc.data} /> :
    doc.kind === "report" ? <ReportDoc data={doc.data} /> : null;
  return (
    <div className="print-overlay" style={{ position: "fixed", inset: 0, zIndex: 600, background: "oklch(0 0 0 / 0.62)", display: "flex", flexDirection: "column", animation: "fadeIn .15s ease" }}>
      <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 18px", background: "var(--elev)", borderBottom: "1px solid var(--line)" }}>
        <Icon name="receipt" size={16} style={{ color: "var(--accent-text)" }} />
        <span style={{ fontWeight: 700, fontSize: 13.5 }}>Print preview</span>
        <span style={{ fontSize: 12, color: "var(--ink-3)" }}>{doc.title}</span>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          <button className="btn sm" onClick={onClose}>Close</button>
          <button className="btn primary sm" onClick={() => window.print()}><Icon name="receipt" size={14} />Print / Save as PDF</button>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "28px 16px", display: "flex", justifyContent: "center" }}>
        <div className="print-doc" style={{ width: 760, maxWidth: "100%", minHeight: 600, background: "#fff", color: PD.ink, borderRadius: 6, padding: "44px 48px", boxShadow: "0 24px 60px -20px oklch(0 0 0 / 0.7)", fontFamily: "'IBM Plex Sans', sans-serif", animation: "pop .2s ease both" }}>
          {body}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { PrintPreview });

</script>

<script type="text/babel">
/* dashboard.jsx — overview landing screen. Exports: DashboardScreen */
const { useMemo: useMemoDash } = React;

function DashboardScreen({ rev, pos, onGoto, onOpenProduct, onReceive }) {
  const alerts = useMemoDash(() => DATA.PRODUCTS
    .map((p) => ({ ...p, _status: statusFromTotal(p.total, p.reorder * 2) }))
    .filter((p) => p._status === "out" || p._status === "low")
    .sort((a, b) => (a._status === "out" ? 0 : 1) - (b._status === "out" ? 0 : 1) || a.total - b.total)
    .slice(0, 6), [rev]);
  const recent = useMemoDash(() => DATA.MOVEMENTS.slice(0, 7), [rev]);
  const inbound = pos.filter((po) => po.status === "Open" || po.status === "Partial").slice(0, 4);
  const sugCount = useMemoDash(() => suggestReorders().length, [rev]);
  const byLoc = useMemoDash(() => DATA.WAREHOUSES.map((w) => {
    let units = 0, value = 0, skus = 0, alerts = 0, ok = 0, sold = 0;
    DATA.PRODUCTS.forEach((p) => {
      const q = p.stock[w.id] || 0;
      units += q; value += q * p.cost;
      if (q > 0) skus++;
      const st = statusFromTotal(q, p.reorder);
      if (st === "out" || st === "low") alerts++;
      if (st === "ok") ok++;
    });
    DATA.MOVEMENTS.forEach((m) => { if (m.wh === w.id && m.type === "Sale") sold += Math.abs(m.qty); });
    return { w, units, value, skus, alerts, sold, healthPct: Math.round(ok / DATA.PRODUCTS.length * 100) };
  }), [rev]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18, animation: "fadeIn .2s ease both" }}>
      <KpiStrip rev={rev} />

      {/* AI nudge banner */}
      <div className="card" style={{ padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, background: "linear-gradient(100deg, var(--accent-soft), transparent 70%)", borderColor: "var(--accent-line)", flexWrap: "wrap" }}>
        <Icon name="sparkles" size={20} style={{ color: "var(--accent-text)", flex: "none" }} />
        <div style={{ flex: 1, minWidth: 200 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>{alerts.length} items below reorder level across {sugCount} suppliers</div>
          <div style={{ fontSize: 12.5, color: "var(--ink-2)" }}>The reorder engine has drafted suggested purchase orders ready for review.</div>
        </div>
        <button className="btn primary" onClick={() => onGoto("purchasing")}><Icon name="truck" size={15} />Review suggested POs</button>
      </div>

      {/* per-location statistics */}
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 10 }}>
          <Icon name="warehouse" size={15} style={{ color: "var(--ink-2)" }} />
          <h2 style={{ margin: 0, fontSize: 14, fontWeight: 700, whiteSpace: "nowrap" }}>By location</h2>
          <span style={{ fontSize: 12, color: "var(--ink-3)" }}>{byLoc.length} sites</span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(246px, 1fr))", gap: 12 }}>
          {byLoc.map(({ w, units, value, skus, alerts, sold, healthPct }) => (
            <div key={w.id} className="card" onClick={() => onGoto("inventory")} style={{ padding: 15, display: "flex", flexDirection: "column", gap: 12, cursor: "pointer" }} onMouseEnter={(e) => e.currentTarget.style.borderColor = "var(--line-strong)"} onMouseLeave={(e) => e.currentTarget.style.borderColor = ""}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 34, height: 34, borderRadius: 8, background: "var(--panel-2)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
                  <Icon name="warehouse" size={16} style={{ color: "var(--accent-text)" }} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{w.short}</div>
                  <div style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{w.type}</div>
                </div>
                {alerts > 0 ? <span className="badge low" style={{ fontSize: 10 }}>{alerts} alert{alerts !== 1 ? "s" : ""}</span> : <span className="badge ok" style={{ fontSize: 10 }}>Healthy</span>}
              </div>
              <div>
                <div style={{ fontSize: 10.5, color: "var(--ink-3)" }}>Inventory value</div>
                <div className="mono tnum" style={{ fontSize: 21, fontWeight: 700, letterSpacing: "-0.01em" }}>{money(value)}</div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, paddingTop: 11, borderTop: "1px solid var(--line-soft)" }}>
                {[["On hand", num(units) + "u"], ["SKUs", num(skus)], ["Sold", num(sold) + "u"]].map(([l, v]) => (
                  <div key={l}><div style={{ fontSize: 10, color: "var(--ink-4)" }}>{l}</div><div className="mono tnum" style={{ fontSize: 14, fontWeight: 600 }}>{v}</div></div>
                ))}
              </div>
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: "var(--ink-3)", marginBottom: 4 }}><span>Stock health</span><span className="mono">{healthPct}%</span></div>
                <div style={{ height: 6, background: "var(--bg)", borderRadius: 99, overflow: "hidden", border: "1px solid var(--line-soft)" }}>
                  <div style={{ height: "100%", width: healthPct + "%", background: healthPct >= 60 ? "var(--ok)" : healthPct >= 35 ? "var(--watch)" : "var(--low)", borderRadius: 99, transition: "width .5s" }} />
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(330px, 1fr))", gap: 16, alignItems: "start" }}>
        {/* alerts */}
        <div className="card" style={{ overflow: "hidden" }}>
          <PanelHead icon="alert" title="Needs attention" color="var(--low)" action="View inventory" onAction={() => onGoto("inventory")} />
          {alerts.map((p) => (
            <div key={p.sku} onClick={() => onOpenProduct(p)} style={{ display: "flex", alignItems: "center", gap: 11, padding: "10px 16px", borderTop: "1px solid var(--line-soft)", cursor: "pointer" }}
              onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
              <Thumb cat={p.category} size={34} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{p.sku}</div>
              </div>
              <span className="mono tnum" style={{ fontSize: 13, fontWeight: 700, color: p._status === "out" ? "var(--out)" : "var(--low)" }}>{p.total}u</span>
              <StatusBadge status={p._status} dotOnly />
            </div>
          ))}
        </div>

        {/* inbound */}
        <div className="card" style={{ overflow: "hidden" }}>
          <PanelHead icon="truck" title="Inbound shipments" color="var(--accent-text)" action="Receiving" onAction={() => onGoto("receiving")} />
          {inbound.map((po) => {
            const sup = DATA.SUPPLIERS.find((s) => s.id === po.supplierId);
            const rem = po.lines.reduce((s, l) => s + (l.qty - l.recv), 0);
            return (
              <div key={po.id} onClick={() => onReceive(po)} style={{ display: "flex", alignItems: "center", gap: 11, padding: "11px 16px", borderTop: "1px solid var(--line-soft)", cursor: "pointer" }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--panel-2)"} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span className="mono" style={{ fontSize: 12.5, fontWeight: 700, color: "var(--accent-text)" }}>{po.id}</span>
                    <PoStatus status={po.status} />
                  </div>
                  <div style={{ fontSize: 12, color: "var(--ink-2)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", marginTop: 2 }}>{sup.name}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div className="mono tnum" style={{ fontSize: 13, fontWeight: 700 }}>{rem}u</div>
                  <div style={{ fontSize: 10.5, color: po.eta < 0 ? "var(--low)" : "var(--ink-3)" }}>{po.eta < 0 ? "overdue" : po.eta === 0 ? "today" : "in " + po.eta + "d"}</div>
                </div>
              </div>
            );
          })}
          {inbound.length === 0 && <div style={{ padding: 18, color: "var(--ink-3)", fontSize: 12.5, borderTop: "1px solid var(--line-soft)" }}>No inbound shipments.</div>}
        </div>

        {/* recent activity */}
        <div className="card" style={{ overflow: "hidden" }}>
          <PanelHead icon="refresh" title="Recent stock activity" color="var(--ink-2)" />
          {recent.map((m) => {
            const p = DATA.pid(m.sku) || {};
            const wname = DATA.WAREHOUSES.find((w) => w.id === m.wh).short;
            const pos2 = m.qty > 0;
            return (
              <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 11, padding: "10px 16px", borderTop: "1px solid var(--line-soft)" }}>
                <div style={{ width: 28, height: 28, borderRadius: 6, flex: "none", display: "flex", alignItems: "center", justifyContent: "center", background: pos2 ? "var(--ok-soft)" : "var(--bg-2)", color: pos2 ? "var(--ok)" : "var(--ink-2)" }}>
                  <Icon name={m.type === "Sale" ? "receipt" : m.type === "Receipt" ? "truck" : "sliders"} size={13} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                  <div className="mono" style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{m.type} · {wname} · {ago(m.days)}</div>
                </div>
                <span className="mono tnum" style={{ fontSize: 13, fontWeight: 700, color: pos2 ? "var(--ok)" : "var(--ink)" }}>{pos2 ? "+" : ""}{m.qty}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PanelHead({ icon, title, color, action, onAction }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "13px 16px" }}>
      <Icon name={icon} size={15} style={{ color: color || "var(--ink-2)" }} />
      <span style={{ fontWeight: 700, fontSize: 13.5 }}>{title}</span>
      {action && <button className="btn ghost sm" style={{ marginLeft: "auto", color: "var(--accent-text)" }} onClick={onAction}>{action}<Icon name="chevR" size={12} /></button>}
    </div>
  );
}

Object.assign(window, { DashboardScreen });

</script>

<script type="text/babel">
/* app.jsx — root: routing, mutable state, topbar, drawers, toasts, tweaks. */
const { useState: useS, useEffect: useE, useCallback: useCb } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#7b6cf0",
  "density": "regular",
  "invLayout": "ledger"
}/*EDITMODE-END*/;

const ACCENTS = { "#7b6cf0": 285, "#2f7ef5": 256, "#16a071": 162, "#e0683f": 47, "#d64b78": 4 };

const ROUTE_META = {
  dashboard: { title: "Operations dashboard", sub: "Live inventory & purchasing overview" },
  pos: { title: "Point of Sale", sub: "Cashier · Ozamis City register" },
  inventory: { title: "Inventory", sub: "Stock levels across all locations" },
  purchasing: { title: "Purchase orders", sub: "Suggested reorders & open POs" },
  receiving: { title: "Receiving", sub: "Receive stock against purchase orders" },
  suppliers: { title: "Suppliers", sub: "Vendors, terms & lead times" },
  accounting: { title: "Accounting", sub: "Double-entry ledger, AR/AP & reports" },
  reports: { title: "Reports", sub: "Sales, inventory & purchasing analytics" },
};

function useViewport() {
  const [w, setW] = useS(window.innerWidth);
  useE(() => { const f = () => setW(window.innerWidth); window.addEventListener("resize", f); return () => window.removeEventListener("resize", f); }, []);
  return w <= 760 ? "mobile" : w <= 1120 ? "tablet" : "desktop";
}

function nextPoId() {
  const max = DATA.POS.reduce((m, po) => Math.max(m, parseInt(po.id.replace("PO-", "")) || 0), 2400);
  return "PO-" + (max + 1);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useS("dashboard");
  const [rev, setRev] = useS(0);
  const bump = useCb(() => setRev((r) => r + 1), []);
  const [layout, setLayout] = useS(t.invLayout || "ledger");
  const [toasts, pushToast] = useToasts();
  const vp = useViewport();
  const [mobileNav, setMobileNav] = useS(false);

  // drawers
  const [product, setProduct] = useS(null);
  const [adjustProduct, setAdjustProduct] = useS(null);
  const [createPO, setCreatePO] = useS(null);   // {open, initial}
  const [receivePO, setReceivePO] = useS(null);
  const [batchPOs, setBatchPOs] = useS(null);
  const [printDoc, setPrintDoc] = useS(null);

  // apply tweaks to :root
  useE(() => {
    const h = ACCENTS[t.accent] != null ? ACCENTS[t.accent] : 285;
    document.documentElement.style.setProperty("--accent-h", h);
    document.documentElement.style.setProperty("--accent", `oklch(0.66 0.17 ${h})`);
    document.documentElement.style.setProperty("--accent-soft", `oklch(0.66 0.17 ${h} / 0.14)`);
    document.documentElement.style.setProperty("--accent-line", `oklch(0.66 0.17 ${h} / 0.40)`);
    document.documentElement.style.setProperty("--accent-text", `oklch(0.80 0.13 ${h})`);
    document.documentElement.setAttribute("data-density", t.density);
  }, [t.accent, t.density]);
  useE(() => { setLayout(t.invLayout); }, [t.invLayout]);

  const alertCount = DATA.PRODUCTS.filter((p) => { const s = statusFromTotal(p.total, p.reorder * 2); return s === "out" || s === "low"; }).length;

  /* ----- actions ----- */
  const openAddToPO = useCb((p) => {
    const sup = DATA.SUPPLIERS.find((s) => s.id === p.supplierId);
    setCreatePO({ open: true, initial: { supplier: sup, lines: [{ sku: p.sku, name: p.name, qty: Math.max(1, p.reorder * 2), cost: p.cost }] } });
  }, []);

  const prefillFromSuggestion = useCb((s) => {
    setCreatePO({ open: true, initial: { supplier: s.supplier, lines: s.items.map(({ p, sug }) => ({ sku: p.sku, name: p.name, qty: sug, cost: p.cost })) } });
  }, []);

  const submitPO = useCb(({ supplier, lines }) => {
    const id = nextPoId();
    DATA.POS.unshift({ id, supplierId: supplier.id, status: "Open", created: 0, eta: supplier.lead, lines: lines.map((l) => ({ sku: l.sku, qty: l.qty, recv: 0, cost: l.cost })) });
    lines.forEach((l) => { const p = DATA.pid(l.sku); if (p) p.onOrder += l.qty; });
    setCreatePO(null); bump();
    pushToast(id + " created · " + lines.length + " lines", "accent");
  }, [pushToast, bump]);

  const confirmAdjust = useCb((p, changes, mode) => {
    let net = 0;
    changes.forEach((c) => {
      p.stock[c.wh] = Math.max(0, (p.stock[c.wh] || 0) + c.delta);
      net += c.delta;
      DATA.MOVEMENTS.unshift({ id: "MV-" + Math.floor(Math.random() * 9000 + 1000), sku: p.sku, type: c.type, qty: c.delta, wh: c.wh, ref: c.reason, days: 0 });
    });
    p.total = DATA.WAREHOUSES.reduce((s, w) => s + (p.stock[w.id] || 0), 0);
    setAdjustProduct(null); bump();
    const verb = mode === "transfer" ? "Stock transferred" : mode === "writeoff" ? "Write-off posted" : "Count adjusted";
    pushToast(verb + " · " + p.sku + " now " + p.total + "u", mode === "writeoff" ? "out" : "ok");
  }, [pushToast, bump]);

  const confirmReceive = useCb((po, recvLines, wh) => {
    let units = 0;
    recvLines.forEach(({ sku, qty }) => {
      const line = po.lines.find((l) => l.sku === sku); if (line) line.recv += qty;
      const p = DATA.pid(sku); if (p) { p.stock[wh] = (p.stock[wh] || 0) + qty; p.total += qty; p.onOrder = Math.max(0, p.onOrder - qty); }
      units += qty;
    });
    const allDone = po.lines.every((l) => l.recv >= l.qty);
    po.status = allDone ? "Received" : "Partial";
    if (allDone) po.eta = -1;
    setReceivePO(null); bump();
    pushToast(units + "u received into " + DATA.WAREHOUSES.find((w) => w.id === wh).short + " · stock & AP updated", "ok");
  }, [pushToast, bump]);

  const confirmBatchReceive = useCb((batchList, wh) => {
    let units = 0, count = batchList.length;
    batchList.forEach((po) => {
      po.lines.forEach((l) => {
        const add = l.qty - l.recv;
        if (add > 0) {
          l.recv = l.qty;
          const p = DATA.pid(l.sku); if (p) { p.stock[wh] = (p.stock[wh] || 0) + add; p.total += add; p.onOrder = Math.max(0, p.onOrder - add); }
          units += add;
        }
      });
      po.status = "Received"; po.eta = -1;
    });
    setBatchPOs(null); bump();
    pushToast(units + "u across " + count + " POs received into " + DATA.WAREHOUSES.find((w) => w.id === wh).short, "ok");
  }, [pushToast, bump]);

  const completeSale = useCb((sale) => {
    // deduct inventory at register location
    sale.cart.forEach((l) => {
      const p = DATA.pid(l.sku);
      if (p) { const take = Math.min(l.qty, p.stock[sale.wh] || 0); p.stock[sale.wh] = (p.stock[sale.wh] || 0) - take; p.total = Math.max(0, p.total - l.qty);
        DATA.MOVEMENTS.unshift({ id: "MV-" + Math.floor(Math.random() * 9000 + 1000), sku: l.sku, type: "Sale", qty: -l.qty, wh: sale.wh, ref: sale.saleId, days: 0 }); }
    });
    // build balanced journal entry
    const L = (account, debit, credit) => ({ account, debit: debit || 0, credit: credit || 0 });
    const tAcct = (id) => (DATA.TENDERS.find((t) => t.id === id) || { acct: "1000" }).acct;
    const lines = [];
    let changeLeft = sale.change;
    sale.payments.forEach((pmt) => {
      let amt = pmt.amount;
      if (pmt.tender === "cash" && changeLeft > 0) { const red = Math.min(changeLeft, amt); amt -= red; changeLeft -= red; }
      if (amt > 0) lines.push(L(tAcct(pmt.tender), amt, 0));
      if ((pmt.tender === "credit" || pmt.tender === "cod") && sale.customer.id !== "C-1001") sale.customer.balance += pmt.amount;
    });
    const serviceTotal = sale.cart.reduce((s, l) => s + (l.install ? 79 : 0), 0);
    const productRev = (sale.subtotal - sale.discount) - serviceTotal;
    lines.push(L("4000", 0, Math.max(0, productRev)));
    if (serviceTotal > 0) lines.push(L("4100", 0, serviceTotal));
    lines.push(L("2100", 0, sale.tax));
    DATA.JOURNAL.unshift(DATA.newJE(0, "POS sale — " + sale.customer.name, sale.saleId, "Sale", lines));
    // COGS / inventory relief
    const cogs = sale.cart.reduce((s, l) => { const p = DATA.pid(l.sku); return s + (p ? p.cost * l.qty : 0); }, 0);
    if (cogs > 0) DATA.JOURNAL.unshift(DATA.newJE(0, "COGS — " + sale.saleId, sale.saleId, "Sale", [L("5000", cogs, 0), L("1200", 0, cogs)]));
    bump();
    pushToast(sale.saleId + " · " + money(sale.total) + " — journal posted", "ok");
  }, [pushToast, bump]);

  const collapsed = vp === "tablet";
  const meta = ROUTE_META[route];

  return (
    <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
      {/* sidebar (desktop/tablet) */}
      {vp !== "mobile" && (
        <Sidebar route={route} setRoute={setRoute} collapsed={collapsed} alertCount={alertCount} />
      )}
      {/* mobile off-canvas nav */}
      {vp === "mobile" && mobileNav && (
        <div style={{ position: "fixed", inset: 0, zIndex: 300 }}>
          <div onClick={() => setMobileNav(false)} style={{ position: "absolute", inset: 0, background: "oklch(0 0 0 / 0.55)" }} />
          <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, animation: "slideIn .2s ease both" }}>
            <Sidebar route={route} setRoute={setRoute} collapsed={false} alertCount={alertCount} mobileOpen setMobileOpen={setMobileNav} />
          </div>
        </div>
      )}

      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        {/* topbar */}
        <header style={{ height: 60, flex: "none", borderBottom: "1px solid var(--line-soft)", display: "flex", alignItems: "center", gap: 14, padding: "0 18px", background: "var(--bg)" }}>
          {vp === "mobile" && (
            <button className="btn icon ghost" onClick={() => setMobileNav(true)} aria-label="Menu"><Icon name="list" size={18} /></button>
          )}
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 700, letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>{meta.title}</div>
            {vp !== "mobile" && <div style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{meta.sub}</div>}
          </div>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 11.5, color: "var(--ink-3)" }}>
              <span className="dot ok" style={{ width: 7, height: 7 }} />{vp !== "mobile" && "Synced · "}<span className="mono">live</span>
            </div>
            {vp !== "mobile" && <button className="btn sm" onClick={() => { setRoute("purchasing"); }}><Icon name="sparkles" size={14} style={{ color: "var(--accent-text)" }} />Reorder AI</button>}
            <button onClick={() => pushToast("Signed in as Dana Reyes · Warehouse Manager", "accent")} style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }} title="Account">
              <Avatar name="Dana Reyes" size={32} />
            </button>
          </div>
        </header>

        {/* content */}
        <main style={{ flex: 1, overflowY: "auto", padding: vp === "mobile" ? "16px 14px 40px" : "22px 26px 56px" }}>
          <div style={{ maxWidth: 1320, margin: "0 auto" }}>
            <div key={route}>
              {route === "dashboard" && <DashboardScreen rev={rev} pos={DATA.POS} onGoto={setRoute} onOpenProduct={setProduct} onReceive={setReceivePO} />}
              {route === "pos" && <POSScreen onComplete={completeSale} toast={pushToast} onPrint={setPrintDoc} />}
              {route === "inventory" && <InventoryScreen rev={rev} layout={layout} setLayout={setLayout} onOpenProduct={setProduct} onNewPO={() => setCreatePO({ open: true, initial: null })} onAddToPO={openAddToPO} />}
              {route === "purchasing" && <PurchaseScreen rev={rev} pos={DATA.POS} onCreate={() => setCreatePO({ open: true, initial: null })} onReceive={setReceivePO} prefillFromSuggestion={prefillFromSuggestion} toast={pushToast} onPrint={setPrintDoc} />}
              {route === "receiving" && <ReceivingScreen pos={DATA.POS} onReceive={setReceivePO} onBatchReceive={setBatchPOs} />}
              {route === "suppliers" && <SuppliersScreen onCreatePO={(s) => setCreatePO({ open: true, initial: { supplier: s, lines: [] } })} />}
              {route === "accounting" && <AccountingScreen rev={rev} onPrint={setPrintDoc} />}
              {route === "reports" && <ReportsScreen rev={rev} toast={pushToast} onPrint={setPrintDoc} />}
            </div>
          </div>
        </main>
      </div>

      {/* drawers */}
      <ProductDrawer product={product} onClose={() => setProduct(null)} onAddPO={openAddToPO} onAdjust={setAdjustProduct} />
      <StockAdjustDrawer product={adjustProduct} onClose={() => setAdjustProduct(null)} onConfirm={confirmAdjust} />
      <CreatePODrawer open={!!(createPO && createPO.open)} initial={createPO && createPO.initial} onClose={() => setCreatePO(null)} onSubmit={submitPO} toast={pushToast} />
      <ReceiveDrawer po={receivePO} onClose={() => setReceivePO(null)} onConfirm={confirmReceive} defaultWh="WH-ILIGAN" />
      <BatchReceiveDrawer pos={batchPOs} onClose={() => setBatchPOs(null)} onConfirm={confirmBatchReceive} />
      <PrintPreview doc={printDoc} onClose={() => setPrintDoc(null)} />

      <Toasts toasts={toasts} />

      {/* tweaks */}
      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={t.accent} options={Object.keys(ACCENTS)} onChange={(v) => setTweak("accent", v)} />
        <TweakRadio label="Density" value={t.density} options={["compact", "regular", "comfy"]} onChange={(v) => setTweak("density", v)} />
        <TweakSection label="Inventory" />
        <TweakSelect label="Default layout" value={t.invLayout} options={[{ value: "ledger", label: "Dense Ledger (table)" }, { value: "board", label: "Stock Board (cards)" }, { value: "command", label: "Command / Health" }]} onChange={(v) => setTweak("invLayout", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
